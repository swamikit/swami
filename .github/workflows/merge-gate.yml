# Posts a single commit status context — `merge-gate` — computed from the
# reviewer stickies (Codex sticky + Claude sticky) and Codex P1 line-level
# comments. Same rule as scripts/safe-merge.sh, but enforced at the GitHub
# level so it catches every merge path (CLI, UI, API) once branch protection
# marks `merge-gate` as a required check. Branch-protection wiring is a
# SEPARATE settings-level step — this workflow does not touch it.
#
# Non-goals: this workflow does NOT gate on the pixel-gate or any other
# verify.yml check (those are their own required checks) and does NOT enforce
# the P2/P3 3-pass rule (that's a human judgment call). It ONLY covers
# reviewer freshness + P1 count.
name: merge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Rapid comment bursts (e.g. reviewer editing a sticky) would otherwise queue
# a redundant run per event. Cancel in-progress runs so only the latest wins;
# the status posted by that latest run is what stays on the commit.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    # issue_comment fires on issues too; scope to PR comments only. The other
    # events (pull_request, pull_request_review_comment) always carry a PR.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # pull_request / pull_request_review_comment carry .pull_request;
          # issue_comment carries .issue. Fall back through both.
          PR_NUM=$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR_NUM" ]; then
            echo "could not resolve PR number from event payload" >&2
            exit 1
          fi
          echo "num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch PR + reviewer signals
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          # Authoritative HEAD sha from the PR itself — event payloads on
          # issue_comment don't carry pull_request.head.sha, and even on
          # pull_request events the payload can lag behind a fresh push if
          # this run was queued mid-burst. Always ask the API.
          gh pr view "$PR_NUM" \
            --json headRefOid,mergeable,state,isDraft \
            > /tmp/pr.json
          HEAD_SHA=$(jq -r '.headRefOid' /tmp/pr.json)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(jq -r '.mergeable' /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state' /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.isDraft' /tmp/pr.json)" >> "$GITHUB_OUTPUT"

          # Issue comments carry the stickies (Codex summary + Claude review
          # + the review.yml "ANTHROPIC_API_KEY is not set" signal).
          # `gh api --paginate` emits ONE JSON array PER PAGE (concatenated,
          # not merged) unless `--slurp` is used. Downstream `jq ... | length`
          # would then emit one integer per page (e.g. "0\n1"), which Bash
          # rejects as "integer expression expected" and (inside an `if`) with
          # `set -e` disabled silently falls through — a fail-open. Pipe
          # through `jq -s 'add'` to slurp+flatten into a single JSON array.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
            | jq -s 'add' \
            > /tmp/issue_comments.json

          # PR review threads (with isResolved) via GraphQL — the REST
          # /pulls/{n}/comments endpoint carries the P1 Badge bodies but
          # exposes no thread-resolution state, so a same-HEAD rebuttal
          # (thread marked resolved without a new push) is invisible there
          # and the gate stays failed on a rebutted P1. GraphQL exposes
          # `reviewThreads { isResolved, comments { ... } }` in one round-trip.
          # `gh api -F key=value` auto-detects the value's type: purely numeric
          # values become JSON numbers, others become strings. The `number`
          # variable is declared `Int!` in the query, so PR_NUM (a bare
          # integer) is passed as an int; `owner`/`name` stay strings.
          gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="${PR_NUM}" \
            -f query='
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100) {
                      pageInfo { hasNextPage }
                      nodes {
                        isResolved
                        comments(first:1) {
                          nodes {
                            author { login }
                            body
                            path
                            line
                            originalLine
                            commit { oid }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            > /tmp/review_threads.json

      - name: Compute gate
        id: gate
        env:
          HEAD_SHA: ${{ steps.fetch.outputs.head_sha }}
          MERGEABLE: ${{ steps.fetch.outputs.mergeable }}
          PR_STATE: ${{ steps.fetch.outputs.state }}
        run: |
          set -euo pipefail

          # ----- trusted reviewer identities -----------------------------
          # Every reviewer/config signal below is filtered to a known bot
          # login BEFORE we read it. Without this, any PR commenter could
          # paste the marker string `<!-- claude-review -->`, the current
          # SHA, and no P1 heading and this workflow would treat it as a
          # clean review — turning the required `merge-gate` status green
          # on a spoofed vote. Same risk for the Codex sticky, Codex P1
          # badges, and the "ANTHROPIC_API_KEY is not set" disable signal.
          # These logins are the accounts that actually post each signal
          # from the corresponding GitHub Actions workflow / App and are
          # not something a regular user can impersonate. If a signal ever
          # starts coming from a different bot, update the login here (and
          # note it in an ADR — this is a trust-boundary change).
          CLAUDE_BOT_LOGIN="github-actions[bot]"
          CODEX_BOT_LOGIN="chatgpt-codex-connector[bot]"

          # ----- reviewer sticky discovery -------------------------------
          # Claude sticky: issue comment authored by the Claude review
          # workflow (via GITHUB_TOKEN → `github-actions[bot]`) tagged
          # with the marker `<!-- claude-review -->`. HEAD is on the
          # header line as `HEAD: \`<sha>\``. P1 count is the N in
          # `### P1 (N)`. Take the LATEST matching sticky — the reviewer
          # updates in place but a race or a marker-lookup regression
          # could leave two.
          CLAUDE_BODY=$(jq -r --arg login "$CLAUDE_BOT_LOGIN" '
            [.[] | select(.user.login == $login)
                 | select(.body | contains("<!-- claude-review -->"))]
            | sort_by(.updated_at) | last | .body // ""
          ' /tmp/issue_comments.json)

          # Parse the sticky.
          #  - HEAD must be present. If it isn't, mark UNPARSEABLE and fail
          #    the gate below — a missing HEAD means we cannot verify the
          #    review actually looked at the current diff, and the freshness
          #    comparison further down would silently pass on `[ -n "$H" ]`.
          #  - `### P1 (N)` may or may not be present: run-claude-review.py's
          #    format_comment() only emits per-severity headings for NONEMPTY
          #    buckets ("_No findings._" when everything is empty, otherwise
          #    just the ones with items) — so a CLEAN review has NO `### P1`
          #    line at all. Treat that as 0 P1s, not as UNPARSEABLE.
          #  - A failure sticky (posted by _post_failure_comment when the
          #    Anthropic call raises) carries a distinct marker and must be
          #    treated as a fail, not as a 0-finding pass.
          CLAUDE_HEAD=""
          CLAUDE_P1=0
          CLAUDE_PRESENT=false
          CLAUDE_UNPARSEABLE=false
          CLAUDE_FAILED=false
          if [ -n "$CLAUDE_BODY" ]; then
            CLAUDE_PRESENT=true
            CLAUDE_HEAD=$(printf '%s\n' "$CLAUDE_BODY" \
              | grep -oE 'HEAD: `[0-9a-f]{7,40}`' \
              | head -1 \
              | grep -oE '[0-9a-f]{7,40}' || true)
            # Extract the count directly from the parens in one pass. The
            # previous form (`grep '### P1 (N)' | grep -oE '[0-9]+'`) matched
            # BOTH the `1` in `P1` and the count, producing a two-line value
            # that failed as a shell integer inside an `if` (where set -e is
            # off) and silently skipped the P1 branch.
            CLAUDE_P1_RAW=$(printf '%s\n' "$CLAUDE_BODY" \
              | sed -nE 's/^### P1 \(([0-9]+)\).*/\1/p' \
              | head -1)
            # Distinct failure marker emitted by run-claude-review.py's
            # _post_failure_comment(). Detect it BEFORE parsing counts so a
            # failure sticky can never route through the "0 P1s" branch.
            if printf '%s\n' "$CLAUDE_BODY" \
                | grep -qF '<!-- claude-review-failure -->'; then
              CLAUDE_FAILED=true
            fi
            if [ -z "$CLAUDE_HEAD" ]; then
              # Missing HEAD → cannot verify freshness → fail closed.
              CLAUDE_UNPARSEABLE=true
            elif [ -n "$CLAUDE_P1_RAW" ]; then
              # Must be a plain non-negative integer — anything else is a
              # producer-format drift we should fail closed on.
              case "$CLAUDE_P1_RAW" in
                *[!0-9]*) CLAUDE_UNPARSEABLE=true ;;
                *)        CLAUDE_P1=$CLAUDE_P1_RAW ;;
              esac
            else
              # No `### P1 (N)` heading present. This is the reviewer's
              # explicit "clean" shape (either `_No findings._` or only
              # nonempty P2/P3 headings). Zero P1s at HEAD.
              CLAUDE_P1=0
            fi
          fi

          # Claude "disabled" signal: review.yml posts a plain comment
          # "Review GA is present but ANTHROPIC_API_KEY is not set in repo
          # secrets." when the secret is absent. Presence of that string on
          # the PR means Claude is intentionally off — gate falls back to
          # Codex alone instead of hanging at pending forever. Restricted
          # to comments authored by `github-actions[bot]` so a human
          # commenter (or a quote of this workflow) cannot type the string
          # and permanently drop the Claude requirement.
          #
          # Staleness guard: review.yml does not delete or supersede this
          # comment when the secret is later configured, so a plain
          # `grep -qF` across the whole PR history would keep CLAUDE_DISABLED
          # true forever — and once the secret IS set, a merge could land
          # in the window before Claude's sticky posts, dropping the reviewer
          # requirement by a stale artifact. Compare updated_at timestamps
          # instead: only treat Claude as disabled when the LATEST "not set"
          # comment is more recent than the LATEST Claude review sticky. As
          # soon as Claude posts (or repost-updates) a sticky, the disable
          # signal is considered obsolete. ISO 8601 timestamps sort lexically,
          # so plain string comparison is correct here.
          DISABLE_COMMENT_TIME=$(jq -r --arg login "$CLAUDE_BOT_LOGIN" '
            [.[] | select(.user.login == $login)
                 | select(.body | contains("ANTHROPIC_API_KEY is not set in repo secrets"))]
            | sort_by(.updated_at) | last | .updated_at // ""
          ' /tmp/issue_comments.json)
          CLAUDE_STICKY_TIME=$(jq -r --arg login "$CLAUDE_BOT_LOGIN" '
            [.[] | select(.user.login == $login)
                 | select(.body | contains("<!-- claude-review -->"))]
            | sort_by(.updated_at) | last | .updated_at // ""
          ' /tmp/issue_comments.json)
          CLAUDE_DISABLED=false
          if [ -n "$DISABLE_COMMENT_TIME" ]; then
            if [ -z "$CLAUDE_STICKY_TIME" ] \
                || [ "$DISABLE_COMMENT_TIME" \> "$CLAUDE_STICKY_TIME" ]; then
              CLAUDE_DISABLED=true
            fi
          fi

          # Codex sticky: issue comment authored by the Codex bot
          # containing the marker string `codex-pull-request-review-summary`
          # with the reviewed SHA in backticks. Take the first
          # backtick-wrapped SHA-looking token. As with Claude, if the SHA
          # can't be extracted we mark the sticky UNPARSEABLE rather than
          # treating an empty CODEX_HEAD as "not present".
          CODEX_BODY=$(jq -r --arg login "$CODEX_BOT_LOGIN" '
            [.[] | select(.user.login == $login)
                 | select(.body | contains("codex-pull-request-review-summary"))]
            | sort_by(.updated_at) | last | .body // ""
          ' /tmp/issue_comments.json)

          CODEX_HEAD=""
          CODEX_PRESENT=false
          CODEX_UNPARSEABLE=false
          if [ -n "$CODEX_BODY" ]; then
            CODEX_PRESENT=true
            CODEX_HEAD=$(printf '%s\n' "$CODEX_BODY" \
              | grep -oE '`[0-9a-f]{7,40}`' \
              | head -1 \
              | tr -d '`' || true)
            if [ -z "$CODEX_HEAD" ]; then
              CODEX_UNPARSEABLE=true
            fi
          fi

          # Codex P1s: the first comment on each PR review thread authored by
          # the Codex bot containing `P1 Badge`, filtered by TWO gates:
          #   1. `.commit.oid == HEAD_SHA` — the badge is pinned to the
          #      current HEAD. Codex re-posts P1s that survive a push, so a
          #      badge on an older commit was superseded by whatever the
          #      push did (or invalidated by Codex silently on rerun).
          #   2. `.isResolved == false` — the thread has NOT been resolved.
          #      This honours the repo's same-HEAD rebuttal mechanism: a
          #      reviewer P1 that has been rebutted and its thread resolved
          #      is closed for that HEAD, even without another push. The
          #      previous form counted only by (1) and ignored resolution
          #      state, so a rebutted P1 kept the gate red forever until a
          #      no-op push.
          # >100 open review threads on one PR is unusual; if the paginator
          # says there's a next page we fail closed rather than under-count.
          CODEX_THREADS_HAS_MORE=$(jq -r \
            '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' \
            /tmp/review_threads.json)
          CODEX_P1_COUNT=$(jq -r --arg sha "$HEAD_SHA" --arg login "$CODEX_BOT_LOGIN" '
            [.data.repository.pullRequest.reviewThreads.nodes[]
             | select(.isResolved == false)
             | .comments.nodes[0]
             | select(.author.login == $login)
             | select(.body | contains("P1 Badge"))
             | select(.commit.oid == $sha)]
            | length
          ' /tmp/review_threads.json)
          CODEX_P1_COUNT=${CODEX_P1_COUNT:-0}
          CODEX_P1_LOC=$(jq -r --arg sha "$HEAD_SHA" --arg login "$CODEX_BOT_LOGIN" '
            first(.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | .comments.nodes[0]
                  | select(.author.login == $login)
                  | select(.body | contains("P1 Badge"))
                  | select(.commit.oid == $sha)
                  | "\(.path):\(.line // .originalLine // "?")")
            // ""
          ' /tmp/review_threads.json)

          # ----- priority: mergeability > unparseable > checks > freshness > P1 --
          STATE=""
          DESC=""

          # 1) Mergeability. CONFLICTING is the only definitive block; other
          #    values (UNKNOWN, MERGEABLE) mean "keep going".
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            STATE=failure
            DESC="PR has merge conflicts"
          fi

          # 2) Unparseable sticky = format drift. A sticky we can't read
          #    is not the same as "no findings" — the reviewer may have
          #    logged P1s in a heading style we no longer recognise. Fail
          #    the gate here so a wording change in either reviewer's
          #    sticky can never silently turn `merge-gate` green.
          if [ -z "$STATE" ] && [ "$CLAUDE_UNPARSEABLE" = "true" ]; then
            STATE=failure
            DESC="Claude sticky present but unparseable (HEAD line missing or malformed)"
          fi
          if [ -z "$STATE" ] && [ "$CODEX_UNPARSEABLE" = "true" ]; then
            STATE=failure
            DESC="Codex sticky present but unparseable (SHA in backticks missing)"
          fi

          # 2a) Claude failure sticky. When the Anthropic call raises,
          #    run-claude-review.py posts a marker-tagged sticky with the
          #    current HEAD and `_reviewer failed — no findings this run._`
          #    before exiting non-zero. That sticky is fresh and reports zero
          #    P1s, so without this branch it would route through the
          #    success path and turn `merge-gate` green on a failed review.
          if [ -z "$STATE" ] && [ "$CLAUDE_FAILED" = "true" ]; then
            STATE=failure
            DESC="Claude review failed to complete — see workflow logs and retry"
          fi

          # 2b) Too many review threads to enumerate in a single GraphQL
          #    page. We ask for 100 which comfortably covers any real PR;
          #    if a PR ever exceeds that, fail closed so we do not silently
          #    under-count unresolved Codex P1 threads that fell off the
          #    page. Paginate here if this ever fires in practice.
          if [ -z "$STATE" ] && [ "$CODEX_THREADS_HAS_MORE" = "true" ]; then
            STATE=failure
            DESC=">100 review threads on this PR — merge-gate cannot enumerate them all safely"
          fi

          # 3) Checks — the Claude review workflow itself. If Claude is
          #    enabled (no "not set" signal) but its sticky isn't up yet,
          #    we're still waiting for the reviewer to post. Codex we can't
          #    interrogate — its absence is treated as "not configured for
          #    this repo" per the spec, not as pending.
          if [ -z "$STATE" ] && [ "$CLAUDE_DISABLED" = "false" ] && [ "$CLAUDE_PRESENT" = "false" ]; then
            STATE=pending
            DESC="Waiting for Claude review to post"
          fi

          # 4) Freshness. A reviewer at an older SHA means the current diff
          #    was never read — that's the whole reason this gate exists.
          if [ -z "$STATE" ] && [ "$CLAUDE_PRESENT" = "true" ] \
              && [ -n "$CLAUDE_HEAD" ] && [ "$CLAUDE_HEAD" != "$HEAD_SHA" ]; then
            STATE=failure
            DESC="Claude stale (at ${CLAUDE_HEAD})"
          fi
          if [ -z "$STATE" ] && [ "$CODEX_PRESENT" = "true" ] \
              && [ -n "$CODEX_HEAD" ] && [ "$CODEX_HEAD" != "$HEAD_SHA" ]; then
            STATE=failure
            DESC="Codex stale (at ${CODEX_HEAD})"
          fi

          # 5) P1s.
          if [ -z "$STATE" ] && [ "$CLAUDE_P1" -gt 0 ]; then
            STATE=failure
            DESC="${CLAUDE_P1} P1 unresolved in Claude review"
          fi
          if [ -z "$STATE" ] && [ "$CODEX_P1_COUNT" -gt 0 ]; then
            STATE=failure
            if [ -n "$CODEX_P1_LOC" ]; then
              DESC="${CODEX_P1_COUNT} P1 unresolved on ${CODEX_P1_LOC}"
            else
              DESC="${CODEX_P1_COUNT} P1 unresolved in Codex review"
            fi
          fi

          # Success. Describe whichever reviewer(s) actually voted so a
          # reader can tell "Codex+Claude clean" apart from "Codex only,
          # Claude off".
          if [ -z "$STATE" ]; then
            STATE=success
            if [ "$CLAUDE_PRESENT" = "true" ] && [ "$CODEX_PRESENT" = "true" ]; then
              DESC="Codex+Claude at HEAD, 0 P1s"
            elif [ "$CLAUDE_PRESENT" = "true" ]; then
              DESC="Claude at HEAD, 0 P1s (Codex not configured)"
            elif [ "$CODEX_PRESENT" = "true" ]; then
              if [ "$CLAUDE_DISABLED" = "true" ]; then
                DESC="Codex at HEAD, 0 P1s (Claude disabled — no secret)"
              else
                DESC="Codex at HEAD, 0 P1s (Claude not configured)"
              fi
            else
              # No reviewer signal at all AND Claude is disabled — nothing
              # to gate on. Keep this a success rather than a permanent
              # pending; a repo with neither reviewer wired is opting out.
              DESC="No reviewers configured for this repo"
            fi
          fi

          # GitHub commit-status descriptions are capped at 140 chars.
          DESC=${DESC:0:140}

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          echo "gate: state=$STATE desc=$DESC head=$HEAD_SHA claude_head=$CLAUDE_HEAD codex_head=$CODEX_HEAD claude_p1=$CLAUDE_P1 codex_p1=$CODEX_P1_COUNT"

      - name: Post commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.fetch.outputs.head_sha }}
          STATE: ${{ steps.gate.outputs.state }}
          DESCRIPTION: ${{ steps.gate.outputs.description }}
          # Link back to this run so a reader who clicks the status lands on
          # the log that computed it — the "why" instead of a blank page.
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${STATE}" \
            -f "context=merge-gate" \
            -f "description=${DESCRIPTION}" \
            -f "target_url=${TARGET_URL}"
