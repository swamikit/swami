# Posts a single commit status context — `merge-gate` — computed from the
# reviewer stickies (Codex sticky + Claude sticky), Codex P1 line-level
# comments, and Codex/Claude P2/P3 findings. Same rule as scripts/safe-merge.sh,
# but enforced at the GitHub level so it catches every merge path (CLI, UI,
# API) once branch protection marks `merge-gate` as a required check.
# Branch-protection wiring is a SEPARATE settings-level step — this workflow
# does not touch it.
#
# Priority order for the status:
#   mergeability > checks (waiting-for-Claude) > freshness > P1s > P2/P3 orphans
#
# The P2/P3 orphan check (added in follow-up to PR #62, prompted by #58 where
# a Claude P2 was silently ignored on merge) fails the gate when a P2 or P3
# finding is present at HEAD AND the PR body/comments contain no issue link
# (`#N` or a github.com/.../issues/N URL) that could be a follow-up. It's
# deliberately lax on WHICH issue is linked — an issue reference anywhere in
# the PR context is treated as sufficient tracking signal; the goal is to
# force a decision (address, or file a follow-up), not to police prose.
#
# Non-goals: this workflow does NOT gate on the pixel-gate or any other
# verify.yml check (those are their own required checks) and does NOT enforce
# the P2/P3 3-pass rule (that's a human judgment call).
name: merge-gate

on:
  pull_request:
    # `edited` is required so PR body changes recompute the gate: the P2/P3
    # orphan step reads the PR `body` for follow-up issue links, so both
    # adding one (should turn a failure green) and removing the only one
    # (should turn a stale success red on unchanged HEAD) must trigger a
    # new run. Without `edited`, the last non-body event's status sticks.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Rapid comment bursts (e.g. reviewer editing a sticky) would otherwise queue
# a redundant run per event. Cancel in-progress runs so only the latest wins;
# the status posted by that latest run is what stays on the commit.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    # issue_comment fires on issues too; scope to PR comments only. The other
    # events (pull_request, pull_request_review_comment) always carry a PR.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # pull_request / pull_request_review_comment carry .pull_request;
          # issue_comment carries .issue. Fall back through both.
          PR_NUM=$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR_NUM" ]; then
            echo "could not resolve PR number from event payload" >&2
            exit 1
          fi
          echo "num=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch PR + reviewer signals
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          # Authoritative HEAD sha from the PR itself — event payloads on
          # issue_comment don't carry pull_request.head.sha, and even on
          # pull_request events the payload can lag behind a fresh push if
          # this run was queued mid-burst. Always ask the API.
          # `body` is fetched here so the P2/P3 orphan step can scan the PR
          # description for follow-up issue links without a second round-trip.
          gh pr view "$PR_NUM" \
            --json headRefOid,mergeable,state,isDraft,body \
            > /tmp/pr.json
          HEAD_SHA=$(jq -r '.headRefOid' /tmp/pr.json)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(jq -r '.mergeable' /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state' /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.isDraft' /tmp/pr.json)" >> "$GITHUB_OUTPUT"

          # Issue comments carry the stickies (Codex summary + Claude review
          # + the review.yml "ANTHROPIC_API_KEY is not set" signal).
          # `--slurp` is required with `--paginate`: without it gh emits one
          # JSON array per page (concatenated), which crashes `json.load()`
          # with `JSONDecodeError: Extra data` on any PR with >100 comments.
          # But `--slurp` "wrap[s] all pages of JSON arrays or objects into
          # an outer JSON array" (per `gh api --help`) — even a single page
          # becomes `[[...]]`, not the flat list the downstream jq `.[]` and
          # Python `for c in ...` expect. `jq 'add // []'` flattens that
          # outer array into one comment list (empty when there are no
          # pages/comments). Both hazards need both fixes to compose.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
            | jq 'add // []' \
            > /tmp/issue_comments.json

          # PR review comments (line-level) carry Codex P1 Badges. Same
          # `--slurp` + flatten rationale as above — one flat array of
          # comments over all pages.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}/comments" \
            | jq 'add // []' \
            > /tmp/review_comments.json

      - name: Compute gate
        id: gate
        env:
          HEAD_SHA: ${{ steps.fetch.outputs.head_sha }}
          MERGEABLE: ${{ steps.fetch.outputs.mergeable }}
          PR_STATE: ${{ steps.fetch.outputs.state }}
        run: |
          set -euo pipefail

          # ----- reviewer sticky discovery -------------------------------
          # Claude sticky: issue comment tagged with the marker
          # `<!-- claude-review -->`. HEAD is on the header line as
          # `HEAD: \`<sha>\``. P1 count is the N in `### P1 (N)`.
          # Take the LATEST matching sticky — the reviewer updates in place
          # but a race or a marker-lookup regression could leave two.
          CLAUDE_BODY=$(jq -r '
            [.[] | select(.body | contains("<!-- claude-review -->"))]
            | sort_by(.updated_at) | last | .body // ""
          ' /tmp/issue_comments.json)

          CLAUDE_HEAD=""
          CLAUDE_P1=0
          CLAUDE_PRESENT=false
          if [ -n "$CLAUDE_BODY" ]; then
            CLAUDE_PRESENT=true
            CLAUDE_HEAD=$(printf '%s\n' "$CLAUDE_BODY" \
              | grep -oE 'HEAD: `[0-9a-f]{7,40}`' \
              | head -1 \
              | grep -oE '[0-9a-f]{7,40}' || true)
            CLAUDE_P1=$(printf '%s\n' "$CLAUDE_BODY" \
              | grep -oE '^### P1 \([0-9]+\)' \
              | head -1 \
              | grep -oE '[0-9]+' || echo 0)
            CLAUDE_P1=${CLAUDE_P1:-0}
          fi

          # Claude "disabled" signal: review.yml posts a plain comment
          # "Review GA is present but ANTHROPIC_API_KEY is not set in repo
          # secrets." when the secret is absent. Presence of that string on
          # the PR means Claude is intentionally off — gate falls back to
          # Codex alone instead of hanging at pending forever.
          CLAUDE_DISABLED=false
          if jq -r '.[].body' /tmp/issue_comments.json \
              | grep -qF 'ANTHROPIC_API_KEY is not set in repo secrets'; then
            CLAUDE_DISABLED=true
          fi

          # Codex sticky: issue comment containing the marker string
          # `codex-pull-request-review-summary` with the reviewed SHA in
          # backticks. Take the first backtick-wrapped SHA-looking token.
          CODEX_BODY=$(jq -r '
            [.[] | select(.body | contains("codex-pull-request-review-summary"))]
            | sort_by(.updated_at) | last | .body // ""
          ' /tmp/issue_comments.json)

          CODEX_HEAD=""
          CODEX_PRESENT=false
          if [ -n "$CODEX_BODY" ]; then
            CODEX_PRESENT=true
            CODEX_HEAD=$(printf '%s\n' "$CODEX_BODY" \
              | grep -oE '`[0-9a-f]{7,40}`' \
              | head -1 \
              | tr -d '`' || true)
          fi

          # Codex P1s: line-level PR review comments containing the string
          # `P1 Badge`, filtered to the CURRENT HEAD (a P1 badge attached to
          # an older commit was already superseded by whatever the new push
          # did — the reviewer will re-post if the issue survived).
          CODEX_P1_COUNT=$(jq -r --arg sha "$HEAD_SHA" '
            [.[] | select(.body | contains("P1 Badge")) | select(.commit_id == $sha)]
            | length
          ' /tmp/review_comments.json)
          CODEX_P1_COUNT=${CODEX_P1_COUNT:-0}
          CODEX_P1_LOC=$(jq -r --arg sha "$HEAD_SHA" '
            first(.[] | select(.body | contains("P1 Badge")) | select(.commit_id == $sha)
                  | "\(.path):\(.line // .original_line // "?")")
            // ""
          ' /tmp/review_comments.json)

          # ----- priority: mergeability > checks > freshness > P1 -------
          # (P2/P3 orphan check runs in the next step; it only fires when
          # this step would otherwise emit success.)
          STATE=""
          DESC=""

          # 1) Mergeability. CONFLICTING is the only definitive block; other
          #    values (UNKNOWN, MERGEABLE) mean "keep going".
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            STATE=failure
            DESC="PR has merge conflicts"
          fi

          # 2) Checks — the Claude review workflow itself. If Claude is
          #    enabled (no "not set" signal) but its sticky isn't up yet,
          #    we're still waiting for the reviewer to post. Codex we can't
          #    interrogate — its absence is treated as "not configured for
          #    this repo" per the spec, not as pending.
          if [ -z "$STATE" ] && [ "$CLAUDE_DISABLED" = "false" ] && [ "$CLAUDE_PRESENT" = "false" ]; then
            STATE=pending
            DESC="Waiting for Claude review to post"
          fi

          # 3) Freshness. A reviewer at an older SHA means the current diff
          #    was never read — that's the whole reason this gate exists.
          if [ -z "$STATE" ] && [ "$CLAUDE_PRESENT" = "true" ] \
              && [ -n "$CLAUDE_HEAD" ] && [ "$CLAUDE_HEAD" != "$HEAD_SHA" ]; then
            STATE=failure
            DESC="Claude stale (at ${CLAUDE_HEAD})"
          fi
          if [ -z "$STATE" ] && [ "$CODEX_PRESENT" = "true" ] \
              && [ -n "$CODEX_HEAD" ] && [ "$CODEX_HEAD" != "$HEAD_SHA" ]; then
            STATE=failure
            DESC="Codex stale (at ${CODEX_HEAD})"
          fi

          # 4) P1s.
          if [ -z "$STATE" ] && [ "$CLAUDE_P1" -gt 0 ]; then
            STATE=failure
            DESC="${CLAUDE_P1} P1 unresolved in Claude review"
          fi
          if [ -z "$STATE" ] && [ "$CODEX_P1_COUNT" -gt 0 ]; then
            STATE=failure
            if [ -n "$CODEX_P1_LOC" ]; then
              DESC="${CODEX_P1_COUNT} P1 unresolved on ${CODEX_P1_LOC}"
            else
              DESC="${CODEX_P1_COUNT} P1 unresolved in Codex review"
            fi
          fi

          # Success. Describe whichever reviewer(s) actually voted so a
          # reader can tell "Codex+Claude clean" apart from "Codex only,
          # Claude off".
          if [ -z "$STATE" ]; then
            STATE=success
            if [ "$CLAUDE_PRESENT" = "true" ] && [ "$CODEX_PRESENT" = "true" ]; then
              DESC="Codex+Claude at HEAD, 0 P1s"
            elif [ "$CLAUDE_PRESENT" = "true" ]; then
              DESC="Claude at HEAD, 0 P1s (Codex not configured)"
            elif [ "$CODEX_PRESENT" = "true" ]; then
              if [ "$CLAUDE_DISABLED" = "true" ]; then
                DESC="Codex at HEAD, 0 P1s (Claude disabled — no secret)"
              else
                DESC="Codex at HEAD, 0 P1s (Claude not configured)"
              fi
            else
              # No reviewer signal at all AND Claude is disabled — nothing
              # to gate on. Keep this a success rather than a permanent
              # pending; a repo with neither reviewer wired is opting out.
              DESC="No reviewers configured for this repo"
            fi
          fi

          # GitHub commit-status descriptions are capped at 140 chars.
          DESC=${DESC:0:140}

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          # Exported for the P2/P3 orphan step — it needs to know which
          # reviewers are actually present so it can skip the ones that
          # aren't (mirrors the same absence rules used above).
          echo "claude_present=$CLAUDE_PRESENT" >> "$GITHUB_OUTPUT"
          echo "claude_disabled=$CLAUDE_DISABLED" >> "$GITHUB_OUTPUT"
          echo "codex_present=$CODEX_PRESENT" >> "$GITHUB_OUTPUT"
          echo "gate: state=$STATE desc=$DESC head=$HEAD_SHA claude_head=$CLAUDE_HEAD codex_head=$CODEX_HEAD claude_p1=$CLAUDE_P1 codex_p1=$CODEX_P1_COUNT"

      - name: Check P2/P3 orphans
        id: orphans
        env:
          HEAD_SHA: ${{ steps.fetch.outputs.head_sha }}
          PREV_STATE: ${{ steps.gate.outputs.state }}
          PREV_DESC: ${{ steps.gate.outputs.description }}
          CLAUDE_PRESENT: ${{ steps.gate.outputs.claude_present }}
          CODEX_PRESENT: ${{ steps.gate.outputs.codex_present }}
        # Runs unconditionally (so its outputs always exist for the next
        # step), but the Python quickly passes through when the gate already
        # decided failure/pending — a higher-priority reason wins, and we
        # don't want a P2/P3 story to override "you have a P1" or "Claude is
        # stale". Also passes through when there are no P2/P3 findings at
        # all — the trivial-clean case in the spec.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          head_sha = os.environ["HEAD_SHA"]
          prev_state = os.environ["PREV_STATE"]
          prev_desc = os.environ["PREV_DESC"]
          claude_present = os.environ.get("CLAUDE_PRESENT", "false") == "true"
          codex_present = os.environ.get("CODEX_PRESENT", "false") == "true"

          def emit(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          def clip(s, n=140):
              # GitHub commit-status descriptions are capped at 140 chars.
              return s if len(s) <= n else s[: n - 1] + "…"

          # Higher-priority reason already decided the outcome — leave it be.
          if prev_state != "success":
              emit("final_state", prev_state)
              emit("final_description", prev_desc)
              print(f"orphans: passthrough (prev_state={prev_state})")
              sys.exit(0)

          with open("/tmp/issue_comments.json") as f:
              issue_comments = json.load(f)
          with open("/tmp/review_comments.json") as f:
              review_comments = json.load(f)
          with open("/tmp/pr.json") as f:
              pr = json.load(f)

          pr_body = pr.get("body") or ""

          # ---- Enumerate P2/P3 findings live at HEAD -------------------
          # A finding is "live" if the reviewer's current-HEAD read still
          # includes it. Older-commit findings are already superseded by the
          # push that produced them (Codex/Claude both repost per push), so
          # per the spec they count as addressed and don't appear here.

          findings = []  # {src, sev, path, line}

          # Codex line-level P2/P3 comments, scoped to commit_id == HEAD.
          # (Same filter the Compute-gate step uses for Codex P1s.)
          if codex_present:
              for c in review_comments:
                  if c.get("commit_id") != head_sha:
                      continue
                  body = c.get("body") or ""
                  if "P2 Badge" in body:
                      sev = "P2"
                  elif "P3 Badge" in body:
                      sev = "P3"
                  else:
                      continue
                  findings.append({
                      "src": "codex",
                      "sev": sev,
                      "path": c.get("path"),
                      "line": c.get("line") or c.get("original_line"),
                  })

          # Claude findings: latest `<!-- claude-review -->` sticky, sections
          # `### P2 (N)` and `### P3 (N)`. Each finding item starts a bullet
          # at column 0 with `- **`; the anchor is the first backtick-wrapped
          # `path:number` token in that bullet's header. A missing anchor is
          # allowed (Claude occasionally files repo-level findings) and is
          # recorded as path=None so the linked-fallback rule applies.
          if claude_present:
              latest_body = ""
              latest_ts = ""
              for c in issue_comments:
                  b = c.get("body") or ""
                  if "<!-- claude-review -->" not in b:
                      continue
                  ts = c.get("updated_at") or ""
                  if ts >= latest_ts:
                      latest_ts = ts
                      latest_body = b
              if latest_body:
                  for sev in ("P2", "P3"):
                      m = re.search(
                          r"^### " + sev + r" \(\d+\)\s*$(.*?)"
                          r"(?=^### |^_reviewer skill:|\Z)",
                          latest_body,
                          flags=re.MULTILINE | re.DOTALL,
                      )
                      if not m:
                          continue
                      section = m.group(1)
                      for item in re.finditer(
                          r"^- \*\*(.+?)\*\*",
                          section,
                          flags=re.MULTILINE,
                      ):
                          header = item.group(1)
                          anchor = re.search(r"`([^`\s]+?):(\d+)`", header)
                          if anchor:
                              findings.append({
                                  "src": "claude",
                                  "sev": sev,
                                  "path": anchor.group(1),
                                  "line": int(anchor.group(2)),
                              })
                          else:
                              findings.append({
                                  "src": "claude",
                                  "sev": sev,
                                  "path": None,
                                  "line": None,
                              })

          # Trivial-clean: no live P2/P3 findings anywhere.
          if not findings:
              emit("final_state", "success")
              emit("final_description", prev_desc)
              print(f"orphans: no P2/P3 findings, pass ({prev_desc})")
              sys.exit(0)

          # ---- "Linked" check ------------------------------------------
          # PR body OR any non-reviewer comment references a GitHub issue
          # (`#N` or a full issues URL). Reviewer stickies are excluded —
          # Claude and Codex both cite `#N` in their prose, and their own
          # references shouldn't satisfy a "did you file a follow-up?" rule.
          # The keyword forms called out in the spec (resolves / fixes /
          # tracks / see #N) are all matched by the generic `#N` pattern.
          hash_re = re.compile(r"(?<!\w)#(\d+)(?!\w)")
          url_re = re.compile(
              r"https?://github\.com/[^/\s]+/[^/\s]+/issues/(\d+)"
          )

          def has_link(text):
              t = text or ""
              return bool(hash_re.search(t) or url_re.search(t))

          linked = has_link(pr_body)
          if not linked:
              for c in issue_comments:
                  b = c.get("body") or ""
                  if not b:
                      continue
                  # Skip reviewer stickies and the review.yml "no key" notice.
                  if "<!-- claude-review -->" in b:
                      continue
                  if "codex-pull-request-review-summary" in b:
                      continue
                  if "ANTHROPIC_API_KEY is not set in repo secrets" in b:
                      continue
                  if has_link(b):
                      linked = True
                      break

          # ---- Address vs. link accounting -----------------------------
          # All findings enumerated above are LIVE at HEAD (see comments on
          # the enumeration blocks). The spec's three "addressed" sub-rules
          # all reduce to "the reviewer's latest read at HEAD no longer lists
          # this" — which, by construction of this list, none of them satisfy.
          # So the only escape hatch is "linked". Orphan == live AND unlinked.
          if linked:
              # Everything is either already gone (not enumerated) or covered
              # by a follow-up issue link — pass through with a note.
              n = len(findings)
              tail = f"; {n} P2/P3 linked to follow-up"
              desc = prev_desc + tail if len(prev_desc) + len(tail) <= 140 else prev_desc
              emit("final_state", "success")
              emit("final_description", clip(desc))
              print(f"orphans: {n} live P2/P3, all linked, pass ({desc})")
              sys.exit(0)

          codex_orphans = [f for f in findings if f["src"] == "codex"]
          claude_orphans = [f for f in findings if f["src"] == "claude"]

          def render_locs(items, cap=2):
              out = []
              for f in items[:cap]:
                  if f["path"] and f["line"] is not None:
                      out.append(f"{f['path']}:{f['line']}")
                  elif f["path"]:
                      out.append(f["path"])
                  else:
                      out.append("no-anchor")
              return out

          parts = []
          for src_label, orphans in (("Codex", codex_orphans), ("Claude", claude_orphans)):
              if not orphans:
                  continue
              n = len(orphans)
              locs = render_locs(orphans)
              suffix = "s" if n != 1 else ""
              label = f"{n} {src_label} P2/P3 orphan{suffix}"
              if locs:
                  more = ", …" if n > len(locs) else ""
                  label += f" ({', '.join(locs)}{more})"
              parts.append(label)

          desc = " + ".join(parts) + " — address or file follow-up."
          emit("final_state", "failure")
          emit("final_description", clip(desc))
          print(f"orphans: FAIL {desc}")
          PY

      - name: Post commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.fetch.outputs.head_sha }}
          STATE: ${{ steps.orphans.outputs.final_state }}
          DESCRIPTION: ${{ steps.orphans.outputs.final_description }}
          # Link back to this run so a reader who clicks the status lands on
          # the log that computed it — the "why" instead of a blank page.
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "state=${STATE}" \
            -f "context=merge-gate" \
            -f "description=${DESCRIPTION}" \
            -f "target_url=${TARGET_URL}"
