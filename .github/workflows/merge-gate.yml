name: merge-gate

# One workflow, one job, one required status: consolidates the merge decision
# into `merge-gate`. See scripts/merge-gate.sh for the priority-ordered rules
# and .github/reviewers.yml for the reviewer registry.
#
# Refactor C of the sequential plan (A: quibble-review App auth — PR #74;
# B: formal Reviews API — PR #75). Consolidates the intent of the closed
# PRs #61 (safe-merge.sh wrapper), #62 (merge-gate.yml v1), and #68
# (P2/P3 orphan extension) on top of the Reviews-API shape shipped in B.
#
# Making `merge-gate` a REQUIRED status check in branch protection is a
# separate one-time repo-settings change Samuel does after this workflow
# lands (Settings → Branches → main → require `merge-gate`). The workflow
# only POSTS the status.

on:
  # Every event that can change the answer. `edited` on pull_request catches
  # PR body edits (linked-issue references live there). pull_request_review
  # catches deep-reviewer verdicts. issue_comment catches follow-up links in a
  # PR comment thread. pull_request_review_comment catches inline replies on a
  # review comment. After resolving a thread, post a PR comment to trigger an
  # issue_comment recheck, or dispatch manually with the explicit PR number.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # GitHub exposes `pull_request_review_thread` as a webhook event, but it is
  # not an Actions workflow trigger. Listing it under `on:` prevents the whole
  # workflow from registering (issue #81). Manual dispatch is the supported
  # re-check path after resolving a review thread when a PR comment is not
  # desirable. Both recheck paths become available only after this file is
  # registered on the default branch; repairing a de-registered required gate
  # needs one admin merge first.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recompute
        required: true
        type: number
  # NOTE: `check_run: [completed]` was intentionally REMOVED.
  #
  # Symptom: after adding that trigger together with a concurrency-group
  # expression that read `github.event.check_run.pull_requests[0].number`,
  # every push to any branch produced a failed merge-gate run with
  # `conclusion=failure, jobs=[]`, and the workflow's API `name` field
  # regressed from `merge-gate` to the file path
  # (`.github/workflows/merge-gate.yml`) — i.e. GitHub was NOT parsing/
  # registering the YAML any more. Diagnosis: the expression evaluator
  # trips on the `[0].number` index chain when `check_run` is undefined
  # on non-check_run events, and the workflow fails registration before
  # any job runs.
  #
  # Losing "auto re-run when verify finishes" is acceptable. If we want
  # to restore that re-trigger, verify.yml (or any other workflow) can
  # explicitly call:
  #   gh workflow run merge-gate.yml --ref "$HEAD_REF" -f pr="$PR"
  # at the end of its run instead of relying on the check_run event.

# Partition triggers by "actionable" vs "isolated" — same fix shape as
# review.yml on this PR (quibble P2 on this PR flagged the asymmetry):
#
#   Actionable — pull_request, pull_request_review,
#   pull_request_review_comment, and workflow_dispatch. All of these change
#   the merge-gate answer, so they share one group
#   `merge-gate-<PR-or-no-pr>` and a newer run cancels the older one
#   (correct staleness behavior).
#
#   Isolated — issue_comment. A maintainer comment can provide a follow-up
#   issue link or intentionally request a recheck, but bot comments must not
#   cancel an in-flight actionable run. Each gets its own per-comment group
#   `merge-gate-<PR>-isolated-<comment-id>` so it (a) never touches the
#   actionable group, and (b) still de-duplicates same-comment edit/delete
#   churn among itself.
#
# Without this partition the same stomping class fixed on review.yml
# applies here: another bot's PR comment fires issue_comment, enters
# the same group, and cancels the in-flight actionable run before the
# job-level `if:` can skip it (concurrency evaluates before `if:`).
# A cancelled merge-gate run leaves a mergeable PR silently pending
# until the next event re-triggers it.
#
# The `'no-pr'` fallback on the actionable group is belt-and-suspenders
# defense: the job-level `if:` already filters no-PR cases (issue_comment
# on regular issues), so this fallback isn't a diagnosed root cause — it
# just keeps the group expression well-formed on every trigger. All
# no-PR events share the one group, which is harmless because the guard
# skips them immediately.
#
# NOTE: The `github.event.check_run.pull_requests[0].number` term was
# intentionally REMOVED from this expression (paired with removing the
# `check_run` trigger above). Its presence broke workflow registration —
# GitHub's expression evaluator trips on the `[0].number` chain when
# check_run is undefined on other events, and the workflow's API `name`
# field regressed to the file path (a diagnostic that GitHub failed
# to parse the YAML). See the block-comment on `on:` above for detail.
concurrency:
  group: >-
    merge-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.inputs.pr || 'no-pr' }}${{
      (github.event_name == 'issue_comment' && github.event.comment)
        && format('-isolated-{0}', github.event.comment.id)
        || ''
    }}
  cancel-in-progress: true

permissions:
  contents: read        # actions/checkout needs this when permissions is an
                        # explicit allowlist (omitted scopes are disabled).
  pull-requests: write  # reads PR + reviews and posts/patches the sticky
                        # <!-- merge-gate --> PR comment. Although PR comments
                        # use the issues-comments REST path, GitHub authorizes
                        # them with pull-requests: write. Live proof under this
                        # exact scope: PR #88 run 33974901494 patched the sticky.
  issues: read          # reads linked-issue state/body for orphan checking
  statuses: write       # posts the `merge-gate` commit status

jobs:
  gate:
    # Skip on issue_comment for non-PR issues (issue_comment fires on
    # regular Issues too — we only care about PR comment threads).
    # (The check_run guard was removed with the check_run trigger; see
    # the `on:` block-comment for why.)
    # Every non-issue_comment event is admitted, including workflow_dispatch;
    # only issue comments on ordinary issues are filtered out.
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for scripts/ + .github/reviewers.yml)
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          # ubuntu-latest ships jq; assert the version so a runner image
          # change without jq is a loud failure rather than a silent one.
          jq --version

      - name: Resolve PR number
        id: pr
        run: |
          set -eu
          # pull_request / pull_request_review / pull_request_review_comment
          # all carry pull_request.number.
          # issue_comment carries issue.number (guarded above to only fire
          # when issue.pull_request is set — i.e. the issue IS a PR).
          # (The check_run branch was removed with the check_run trigger;
          # see the `on:` block-comment for why.)
          # workflow_dispatch uses the explicit `pr` input.
          PR="${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.inputs.pr }}"
          if [ -z "$PR" ]; then
            echo "::error::could not resolve PR number from event payload"
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Compute + post merge-gate status
        env:
          # `GH_TOKEN` — the merge-gate script uses `gh` for reads (PR view,
          # reviews list, issue view) AND for the POST to /statuses/{sha}.
          # `statuses: write` permission above authorizes the POST.
          GH_TOKEN: ${{ github.token }}
          # REPO is redundant with `gh repo view` but explicit is faster.
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # The script resolves headRefOid from `gh pr view "$PR"`; it never
          # relies on github.event.pull_request.head.sha, so dispatch and
          # comment triggers post status to the same source-of-truth HEAD.
          bash scripts/merge-gate.sh --repo "$REPO" --pr "$PR"
