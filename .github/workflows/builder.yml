name: builder

# Builder GA — issue-triggered work.
#
# Two entry points, one workflow:
#
#   1. `translate` label (or workflow_dispatch): pattern-translation path.
#      A tracking issue labeled `translate` (body: "translate <PatternStem>",
#      e.g. "translate Interaction_Drag") fires the `translate` job. Builder
#      pulls the .origami, runs parser → codegen → writes
#      app/Swami/Patterns/<Stem>.swift, wires the new case into SwamiHost's
#      ContentView switch, appends the pattern to verify.yml's PATTERNS env,
#      and opens a PR against main using the pattern.md template so verify.yml's
#      pixel gate self-verifies the translation (Beat 3).
#
#   2. `ready` label: general issue-pickup path. Any issue Triage GA promotes
#      to `ready` (see .github/workflows/triage.yml + scripts/run-triage.py)
#      is picked up by the `ready` job. It hands the issue body — the spec
#      for what to do — to Claude, which returns a plan (branch, files to
#      write, commit message, PR body). Builder applies the plan and opens
#      a PR. This is what closes the "filed follow-up issues have no
#      consumer" failure mode: Triage decides the issue is actionable →
#      Builder picks it up.
#
# V1: parser + codegen are placeholders — they may not yet handle a given pattern.
# Ship the skeleton so it's wired end-to-end; upgrade the translate step (Claude
# API call, richer codegen) once the parser generalizes past Touch.
#
# Guardrails:
#  - Forks never get to run (no secret access, no push rights).
#  - Missing ANTHROPIC_API_KEY skips the API-driven translate step (parser+codegen
#    still run; the PR still opens, marked as skeleton). The `ready` job hard-
#    requires the key — without Claude it has no way to plan the change.
#  - macos-15 chosen to match verify.yml's runner so a follow-on interactive
#    verify (Origami-installed) can reuse the same environment; codegen itself
#    doesn't need macOS, so a later cost-cut may split parser+codegen back to
#    ubuntu with verify staying on macos-15. The `ready` job runs on
#    ubuntu-latest (no macOS/Origami needs).

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Origami pattern stem (e.g. Interaction_Drag). Resolves to https://origami.design/public/origami_files/patterns/<stem>.origami. Leave blank when dispatching the ready path.'
        required: false
        type: string
      issue_number:
        description: 'Issue number to pick up on the ready path. Triage GA dispatches this workflow with an issue number because the label it applied with GITHUB_TOKEN cannot itself fire an issues.labeled workflow run (GitHub recursion guard). Leave blank when dispatching the translate path.'
        required: false
        type: string

permissions:
  contents: write        # push translate/<pattern> branch
  pull-requests: write   # open the PR
  issues: write          # comment back onto the tracking issue
  actions: write         # `gh workflow run verify.yml/review.yml` — the
                         # workflow_dispatch REST endpoint requires
                         # actions:write, and without it both dispatches
                         # from run-builder-from-issue.py (and the
                         # translate job's verify.yml trigger) 403 and
                         # `sh_ok` silently downgrades that to a warning.
                         # The whole point of the ready path is that
                         # verify.yml + review.yml wake on Builder-opened
                         # PRs; missing this scope collapses the gate
                         # unreachably (Codex P1 round 3, Claude sticky P1 #1).

jobs:
  translate:
    # issues.labeled fires for every label; gate to the `translate` label only.
    # workflow_dispatch is allowed only when a `pattern` input is provided, so a
    # ready-path dispatch (which passes `issue_number` and leaves `pattern`
    # blank) doesn't also fire this job. Fork PRs can't reach this workflow
    # (issues events run in the base repo), but the api-key gate below still
    # protects the Claude call from a missing-secret environment.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.pattern != '') ||
      (github.event_name == 'issues' && github.event.label.name == 'translate')
    runs-on: macos-15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve pattern name
        id: pattern
        env:
          DISPATCH_INPUT: ${{ inputs.pattern }}
          ISSUE_TITLE:    ${{ github.event.issue.title }}
        run: |
          # workflow_dispatch: pattern comes from the input.
          # issues.labeled:    the *title* carries user intent as "translate <Stem>"
          #                    (e.g. "translate Interaction_Drag"). We deliberately do
          #                    NOT parse the body — issue bodies routinely contain the
          #                    phrase "translate the Origami pattern ..." and a loose
          #                    match then extracts "the" (#84 / Builder run 33958828029).
          # Stem shape: [A-Z][A-Za-z0-9]*_[A-Za-z0-9_]+ — a capitalized category prefix
          # (Interaction_, Layer_, Animation_, Transition_, ...) joined by an underscore
          # to a capitalized name. That's the naming convention on origami.design.
          set -eu
          if [ -n "${DISPATCH_INPUT:-}" ]; then
            STEM="$DISPATCH_INPUT"
          else
            STEM=$(printf '%s\n' "$ISSUE_TITLE" \
              | grep -Eo '[Tt]ranslate[[:space:]]+[A-Z][A-Za-z0-9]*_[A-Za-z0-9_]+' \
              | head -1 \
              | awk '{print $2}')
          fi
          if [ -z "${STEM:-}" ]; then
            echo "::error::could not resolve pattern stem from issue title '${ISSUE_TITLE:-}' (expected: 'translate <Category>_<Name>', e.g. 'translate Interaction_Drag')"
            exit 1
          fi
          # Slug: lowercased stem with the "Interaction_" prefix stripped so
          # touch:Interaction_Touch, drag:Interaction_Drag, etc. Matches the
          # convention already in verify.yml's PATTERNS.
          SLUG=$(echo "$STEM" | sed -E 's/^Interaction_//' | tr '[:upper:]' '[:lower:]')
          echo "stem=$STEM"   >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"   >> "$GITHUB_OUTPUT"
          echo "branch=translate/$STEM" >> "$GITHUB_OUTPUT"
          echo "==> stem=$STEM  slug=$SLUG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch .origami source
        id: fetch
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
        run: |
          set -eu
          mkdir -p out
          SRC_URL="https://origami.design/public/origami_files/patterns/${STEM}.origami"
          echo "src_url=$SRC_URL" >> "$GITHUB_OUTPUT"
          curl -sL -o "out/${STEM}.origami" "$SRC_URL"
          if ! [ -s "out/${STEM}.origami" ]; then
            echo "::error::fetch failed for $SRC_URL"
            exit 1
          fi

      - name: Guard — ANTHROPIC_API_KEY presence
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Placeholder for the Claude-driven translate pass. V1 doesn't call the
          # API yet — the parser+codegen skeleton runs regardless. When the API
          # call lands, downstream steps read has_key to decide whether to enrich
          # the IR / codegen or ship the deterministic skeleton alone.
          if [ -n "${KEY:-}" ]; then
            echo "has_key=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not present — Claude-assisted translate step will be skipped (deterministic skeleton only)."
          fi

      - name: Parse (.origami → IR)
        id: parse
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
        # continue-on-error: parser is still Touch-shaped (CLAUDE.md TODO: generalize
        # port-default decoding). Failing here shouldn't abort the PR — we still want
        # the branch + PR opened so the tracker sees the attempt and a human can pick
        # it up. Later, once the parser handles arbitrary graphs, flip this to hard-fail.
        continue-on-error: true
        run: |
          # origami_graph.py takes <input.origami> <dest.json> and writes JSON to the
          # dest path (not stdout — CLI contract, see tool/src/parser/origami_graph.py).
          # Pass the dest explicitly; stdout redirection would leave an empty file
          # (Codex P1 L139).
          set -eu
          python3 tool/src/parser/origami_graph.py \
            "out/${STEM}.origami" \
            "out/${STEM}.ir.json"
          echo "ir=out/${STEM}.ir.json" >> "$GITHUB_OUTPUT"
          if [ -s "out/${STEM}.ir.json" ]; then
            echo "==> IR bytes: $(wc -c <"out/${STEM}.ir.json")"
          else
            echo "==> IR empty or missing (parser failed for ${STEM})"
          fi

      - name: Codegen (IR → SwiftUI)
        id: codegen
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
        continue-on-error: true
        run: |
          # swiftgen.py takes <ir.json> <dest.swift> and writes to the dest path
          # (Codex P1 L139 — same contract as the parser).
          #
          # When parser produced no usable IR, emit a public fallback view so it's
          # visible from SwamiHost (ContentView.swift lives in the SwamiHost target;
          # generated files live in the Swami framework target — internal symbols
          # aren't reachable across modules). `public struct` + `public init` +
          # `public var body` is what makes `${STEM}View()` compile from the host
          # (Codex P1 L164).
          set -eu
          mkdir -p app/Swami/Patterns
          if [ -s "out/${STEM}.ir.json" ]; then
            python3 tool/src/codegen/swiftgen.py \
              "out/${STEM}.ir.json" \
              "app/Swami/Patterns/${STEM}.swift"
          else
            cat > "app/Swami/Patterns/${STEM}.swift" <<SWIFT
          // TODO(builder): parser+codegen did not yet handle ${STEM}.
          // Skeleton PR only — regenerate once the parser generalizes past Touch.
          import SwiftUI
          import Swami

          public struct ${STEM}View: View {
              public init() {}
              public var body: some View { Text("${STEM} — not yet translated") }
          }
          SWIFT
          fi

      - name: Pre-gate — tree-sitter Swift syntax
        # Hard-fail if the generated (or fallback) Swift has ERROR / MISSING nodes.
        # `continue-on-error` on parse+codegen keeps a bad-parse run alive so the
        # PR still opens with a skeleton — but a *syntactically invalid* Swift file
        # must never be pushed. That's the whole point of the pre-gate (Codex P1
        # L153; CLAUDE.md: cloud-side syntax pre-gate). No `continue-on-error`
        # here on purpose.
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
        run: |
          set -eu
          python3 -m pip install --quiet tree_sitter tree_sitter_swift
          python3 - "app/Swami/Patterns/${STEM}.swift" <<'PY'
          import sys, pathlib
          import tree_sitter
          import tree_sitter_swift as ts_swift

          path = pathlib.Path(sys.argv[1])
          src = path.read_bytes()
          lang = tree_sitter.Language(ts_swift.language())
          parser = tree_sitter.Parser(lang)
          tree = parser.parse(src)

          errors = []
          def walk(n):
              if n.type == "ERROR" or n.is_missing:
                  errors.append((n.start_point, n.type, n.is_missing))
              for c in n.children:
                  walk(c)
          walk(tree.root_node)

          if errors:
              for (row, col), t, missing in errors[:20]:
                  kind = "MISSING " if missing else ""
                  print(f"::error file={path},line={row+1},col={col+1}::pre-gate: {kind}{t}")
              raise SystemExit(f"tree-sitter pre-gate failed: {len(errors)} error(s) in {path}")
          print(f"==> tree-sitter pre-gate passed for {path}")
          PY

      - name: Wire ContentView switch
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
          SLUG: ${{ steps.pattern.outputs.slug }}
        run: |
          # Idempotent: if a `case "<slug>":` already exists, leave the file alone
          # (a rerun of a labeled issue shouldn't duplicate the case). Otherwise
          # insert `case "<slug>": <Stem>View()` immediately before the `default:`
          # line inside the switch, matching the existing style.
          set -eu
          FILE="app/SwamiHost/ContentView.swift"
          if grep -q "case \"$SLUG\"" "$FILE"; then
            echo "==> case \"$SLUG\" already wired — leaving ContentView untouched."
            exit 0
          fi
          python3 - "$FILE" "$SLUG" "$STEM" <<'PY'
          import sys, pathlib
          path, slug, stem = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path(path)
          src = p.read_text()
          needle = "        default:"
          if needle not in src:
              raise SystemExit(f"could not find switch default in {path}")
          insert = f'        case "{slug}": {stem}View()\n'
          out = src.replace(needle, insert + needle, 1)
          p.write_text(out)
          print(f"==> inserted case \"{slug}\": {stem}View() before default")
          PY

      - name: Wire verify.yml PATTERNS env
        env:
          STEM: ${{ steps.pattern.outputs.stem }}
          SLUG: ${{ steps.pattern.outputs.slug }}
        run: |
          # Append " <slug>:<stem>" to the PATTERNS line in verify.yml if not
          # already present. verify.yml's compare loop splits on whitespace, so
          # space-separation is the shape it expects (see verify.yml line 30).
          set -eu
          FILE=".github/workflows/verify.yml"
          if grep -qE "^[[:space:]]+PATTERNS:.*${SLUG}:${STEM}" "$FILE"; then
            echo "==> ${SLUG}:${STEM} already in PATTERNS — leaving verify.yml untouched."
            exit 0
          fi
          python3 - "$FILE" "$SLUG" "$STEM" <<'PY'
          import sys, re, pathlib
          path, slug, stem = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path(path)
          src = p.read_text()
          pat = re.compile(r'^(?P<indent>[ \t]+)PATTERNS:[ \t]*"(?P<val>[^"\n]*)"', re.M)
          m = pat.search(src)
          if not m:
              raise SystemExit("PATTERNS line not found in verify.yml")
          entry = f"{slug}:{stem}"
          val = m.group("val").strip()
          new_val = f'{val} {entry}' if val else entry
          out = src[:m.start()] + f'{m.group("indent")}PATTERNS: "{new_val}"' + src[m.end():]
          p.write_text(out)
          print(f"==> PATTERNS now: {new_val}")
          PY

      - name: Commit + push translate branch
        id: push
        env:
          STEM:   ${{ steps.pattern.outputs.stem }}
          SLUG:   ${{ steps.pattern.outputs.slug }}
          BRANCH: ${{ steps.pattern.outputs.branch }}
        run: |
          set -eu
          git config user.name  "swami-builder"
          git config user.email "builder@swami.local"
          git checkout -b "$BRANCH"

          # Stage only what Builder is meant to touch — never `git add -A`. Keep
          # out/ (the fetched .origami + IR) out of the branch; those are runtime
          # artifacts, not source (upload them separately if debugging is needed).
          git add "app/Swami/Patterns/${STEM}.swift"
          git add "app/SwamiHost/ContentView.swift"
          git add ".github/workflows/verify.yml"

          if git diff --cached --quiet; then
            echo "::warning::no changes staged — nothing to commit for ${STEM}."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "translate: ${STEM} (builder skeleton)"
          git push --set-upstream origin "$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          STEM:     ${{ steps.pattern.outputs.stem }}
          SLUG:     ${{ steps.pattern.outputs.slug }}
          BRANCH:   ${{ steps.pattern.outputs.branch }}
          SRC_URL:  ${{ steps.fetch.outputs.src_url }}
          ISSUE:    ${{ github.event.issue.number }}
          HAS_KEY:  ${{ steps.guard.outputs.has_key }}
        run: |
          set -eu
          TEMPLATE=".github/PULL_REQUEST_TEMPLATE/pattern.md"
          BODY=$(mktemp)

          # Pre-fill the pattern.md template. Verify evidence link is a
          # placeholder — verify.yml's sticky comment will replace it once
          # pixel-gate runs on this PR.
          {
            echo "# New pattern"
            echo
            echo "One \`.origami\` → one generated view → one PR (AGENTS.md Beat 1: Isolate)."
            echo
            echo "## Pattern"
            echo "- **Name:** ${STEM}"
            echo "- **\`.origami\` source URL:** ${SRC_URL}"
            echo "- **Primary Origami patch(es):** _TBD — Builder skeleton; fill in after codegen upgrades._"
            echo "- **Helpers touched (new / existing):** \`app/Swami/Patterns/${STEM}.swift\` (new), \`app/SwamiHost/ContentView.swift\`, \`.github/workflows/verify.yml\`"
            echo
            echo "## Structural check"
            echo "- [ ] Ports match the mirrored patch (names + directions)"
            echo "- [ ] Native SwiftUI used where it covers the patch; helper justified where it doesn't"
            echo "- [ ] Generated Swift passes the tree-sitter pre-gate (Beat 2)"
            echo "- [ ] IR preserves semantic names (colors, type styles, patch labels) per ADR-0007"
            echo
            echo "## Verify evidence"
            echo "- [ ] Sticky comment link (swami / origami / diff side-by-side, Beat 3): _populated by \`verify.yml\` once pixel-gate runs on this PR_"
            echo "- [ ] \`NEEDS-VERIFY.md\` entry resolved on merge (Beat 4)"
            echo
            echo "---"
            echo
            echo "### Builder metadata"
            if [ -n "${ISSUE:-}" ]; then
              echo "- Tracking issue: #${ISSUE}"
            fi
            echo "- Slug: \`${SLUG}\`"
            echo "- Runner: \`macos-15\`"
            echo "- Claude-assisted translate: \`${HAS_KEY}\` (V1 placeholder — parser+codegen only)"
          } > "$BODY"

          # Suppress the pattern.md template auto-inject so our filled body isn't
          # duplicated. gh reads templates from --template only, and body from
          # --body-file, so this is already the case; keeping the note explicit.
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "translate: ${STEM}" \
            --body-file "$BODY"

      - name: Trigger verify.yml on the translate branch
        # GITHUB_TOKEN-authored pushes and PR creations DO NOT fire downstream
        # `push` / `pull_request` workflow events (GitHub's recursion guard on
        # the automatic token). Without this step verify.yml's pixel gate never
        # runs on Builder-opened PRs, and the sticky evidence link in the PR
        # body is a permanent placeholder.
        #
        # `workflow_dispatch` is the documented exception — dispatch events *do*
        # fire even when triggered via GITHUB_TOKEN — so we explicitly dispatch
        # verify.yml against the translate branch. Once repo owners add a PAT/
        # GitHub-App token as `secrets.BUILDER_TRIGGER_PAT`, `gh pr create` can
        # switch to that token and this manual dispatch becomes redundant; until
        # then the dispatch is the guaranteed path (Codex P1 L261).
        if: steps.push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:    ${{ github.repository }}
          BRANCH:  ${{ steps.pattern.outputs.branch }}
        run: |
          set -eu
          # --ref points the dispatch at the translate branch so verify.yml runs
          # against the newly-pushed Swift, not main.
          if ! gh workflow run verify.yml --repo "$REPO" --ref "$BRANCH"; then
            echo "::warning::gh workflow run verify.yml --ref $BRANCH failed — pixel gate must be triggered manually."
          else
            echo "==> dispatched verify.yml against $BRANCH"
          fi

      - name: Comment back onto tracking issue
        if: >-
          github.event_name == 'issues'
          && steps.push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:  ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          STEM:  ${{ steps.pattern.outputs.stem }}
          BRANCH: ${{ steps.pattern.outputs.branch }}
        run: |
          set -eu
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Builder opened a translate PR for \`${STEM}\` from branch \`${BRANCH}\`. Pixel gate runs next — check verify.yml's sticky comment on the PR for evidence."

      - name: Upload builder artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-${{ steps.pattern.outputs.stem }}
          path: out/
          if-no-files-found: warn

  ready:
    # Triage GA promotes an issue to `ready` when it's actionable as written.
    # This job picks up any such issue: Claude reads the body (the spec),
    # returns a plan, Builder applies it and opens a PR. Separate from the
    # translate job because the machinery is different (no .origami fetch,
    # no ContentView wiring, no macOS runner needed) — sharing steps behind
    # a mode gate would fork the readability of the translate path.
    #
    # Two entry points on purpose (Codex P1 discussion_r3938968244): a human
    # applying the `ready` label directly fires the issues.labeled path, and
    # Triage GA (whose GITHUB_TOKEN-applied label CANNOT itself fire this
    # workflow — GitHub's recursion guard) instead dispatches this workflow
    # explicitly with `inputs.issue_number`. The dispatch path exists because
    # workflow_dispatch is the documented exception to the GITHUB_TOKEN
    # recursion rule (see .github/workflows/builder.yml translate-job's
    # "Trigger verify.yml" step for the same pattern applied downstream).
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ready') ||
      (github.event_name == 'workflow_dispatch' && inputs.issue_number != '')
    runs-on: ubuntu-latest
    env:
      # Same job-level hoist as review.yml — step-level `if:` needs to read
      # env.ANTHROPIC_API_KEY at gate-evaluation time.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch issue context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          # On the issues.labeled path, github.event.issue.number is set.
          # On the workflow_dispatch path (Triage GA calling in — see the
          # job-level `if:` above), it's empty and we fall through to the
          # dispatch input. Guard the empty case so we fail loudly instead
          # of running `gh issue view ""` and getting a confusing error.
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -eu
          if [ -z "${ISSUE_NUM:-}" ]; then
            echo "::error::no issue number resolved — issues.labeled payload was empty and inputs.issue_number was not set."
            exit 1
          fi
          gh issue view "$ISSUE_NUM" \
            --json number,title,body,url,labels,author,createdAt,state \
            --jq . > /tmp/issue.json
          echo "issue=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=ready/issue-$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Load builder context
        run: |
          set -eu
          : > /tmp/context.md
          [ -f AGENTS.md ] && { cat AGENTS.md >> /tmp/context.md; echo '---' >> /tmp/context.md; }
          for adr in docs/decisions/*.md; do
            [ -f "$adr" ] && { cat "$adr" >> /tmp/context.md; echo '---' >> /tmp/context.md; }
          done

      - name: Guard — ANTHROPIC_API_KEY presence
        # The ready path hard-requires the key: without Claude there's no
        # planner. Comment on the issue so the failure isn't silent, then
        # fail the job so the workflow-run status flags the miss.
        if: env.ANTHROPIC_API_KEY == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.context.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --body "Builder GA saw the \`ready\` label but ANTHROPIC_API_KEY is not set in repo secrets. Set it in Settings → Secrets and variables → Actions to enable Builder pickup."
          exit 1

      - name: Install anthropic SDK
        if: env.ANTHROPIC_API_KEY != ''
        # Pin the SDK — same reasoning as review.yml / triage.yml.
        run: python3 -m pip install --quiet 'anthropic==1.4.0'

      - name: Configure git author
        # swami-builder identity matches the translate job so PR history reads
        # consistently regardless of which entry point produced the branch.
        run: |
          git config user.name  "swami-builder"
          git config user.email "builder@swami.local"

      - name: Plan + open PR (Claude)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON_FILE: /tmp/issue.json
          CONTEXT_FILE: /tmp/context.md
          BRANCH: ${{ steps.context.outputs.branch }}
        # scripts/run-builder-from-issue.py:
        #   - reads /tmp/issue.json (the spec) + /tmp/context.md (AGENTS + ADRs)
        #   - asks Claude for a plan (files-to-write + commit message + PR body)
        #   - writes the files, commits, pushes $BRANCH, opens the PR
        #   - comments back on the triggering issue with the PR link
        # git and gh live in the script so the workflow stays declarative.
        run: python3 scripts/run-builder-from-issue.py
