name: cleanup-docs-preview

# Keep cleanup independent from publishing so closing a PR cannot strand its
# preview when a publish run fails or is cancelled.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# Do not share publish-docs' queue: GitHub retains at most one pending run per
# group, so a later publish could displace a queued close cleanup. Cross-writer
# races are handled by the bounded fetch/rebase/push loop below.
concurrency:
  group: gh-pages-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  clean-pr-preview:
    # Fork pull_request tokens are read-only, and fork previews cannot have
    # been published by this workflow for the same reason.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - name: Remove closed pull request preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages does not exist; no preview to remove"
            exit 0
          fi
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -r --ignore-unmatch "pr-${PR}"
          if git diff --cached --quiet; then
            echo "no preview to remove"
            exit 0
          fi
          git commit -m "docs: remove preview for PR #${PR}"
          # Rebase before each push so concurrent publishers or other cleanup
          # runs cannot strand this preview.
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            if ! git rebase origin/gh-pages; then
              git rebase --abort || true
              echo "::error::preview cleanup conflicts with the current gh-pages branch"
              exit 1
            fi
            if git push origin gh-pages; then
              exit 0
            fi
            echo "push raced another gh-pages writer; retry ${attempt}/3"
          done
          echo "::error::could not publish preview cleanup after 3 attempts"
          exit 1
