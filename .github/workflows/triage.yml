name: triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirrors review.yml's fork guard. An issue itself is never "from a fork"
      # (issues live on the base repo), but keep the shape symmetric: if this
      # workflow later grows to watch issue_comment on PRs, the guard applies.
      # For now the guard is a no-op that documents the invariant.
      - name: Determine fork status
        id: fork
        run: |
          echo "is_fork=false" >> "$GITHUB_OUTPUT"

      - name: Fetch issue context
        id: context
        if: steps.fork.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          gh issue view $ISSUE_NUM \
            --json number,title,body,url,labels,author,createdAt,state \
            --jq . > /tmp/issue.json
          # Corpus of open issues for dedup analysis. Cap at 100 to bound tokens;
          # if the repo grows past that a follow-up can add labels-based prefiltering.
          gh issue list --state open --limit 100 \
            --json number,title,body,labels,url,createdAt \
            --jq . > /tmp/open-issues.json
          echo "issue=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Load triage context
        if: steps.fork.outputs.is_fork != 'true'
        run: |
          cat AGENTS.md > /tmp/context.md 2>/dev/null || \
            echo "warning: AGENTS.md not present on this branch" >&2
          echo '---' >> /tmp/context.md
          # skill/triage/SKILL.md lands in a follow-up PR; gate on presence
          # (same shape as review.yml's skill/review/SKILL.md load).
          if [ -f skill/triage/SKILL.md ]; then
            cat skill/triage/SKILL.md >> /tmp/context.md
            echo '---' >> /tmp/context.md
          else
            echo "warning: skill/triage/SKILL.md not present on this branch — skipping skill context load" >&2
          fi
          for adr in docs/decisions/*.md; do
            [ -f "$adr" ] && cat "$adr" >> /tmp/context.md
            echo '---' >> /tmp/context.md
          done

      # NOTE: This step is a placeholder for the Claude API call.
      # Full implementation requires anthropic-sdk or claude-code-action; both need ANTHROPIC_API_KEY.
      # This PR ships the workflow skeleton; the actual Claude call lands in a follow-up
      # once ANTHROPIC_API_KEY is present in Actions secrets.
      #
      # Actions the Claude call is expected to take (documented so the follow-up
      # implementation has a fixed spec, and so the placeholder self-documents):
      #   - Apply labels to the triggering issue:
      #       * type:{bug,feature,docs,chore,parser,codegen,harness,infra}
      #       * priority:{p0,p1,p2,p3}
      #   - Dedup analysis: scan /tmp/open-issues.json for near-duplicates. If a
      #     match is found, comment on the triggering issue with the match URL
      #     and a suggestion to close as duplicate (do NOT auto-close — human gate).
      #   - Readiness label:
      #       * 'ready'      — issue is actionable as written (repro, scope, DoD legible)
      #       * 'needs-info' — issue is missing repro / scope / expected behavior
      #   - Never edit the issue body. Never close the issue. Labels + comment only.
      - name: Run Claude triage (placeholder)
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ steps.context.outputs.issue }}
        run: |
          echo "== would call Claude API here with:"
          echo "  - system: /tmp/context.md (AGENTS + skill/triage + ADRs)"
          echo "  - user: /tmp/issue.json + /tmp/open-issues.json (dedup corpus)"
          echo "  - tools: gh (label the issue, comment with dedup suggestion)"
          # Real implementation: pip install anthropic; python scripts/run-triage.py
          echo "PLACEHOLDER — real Claude integration to follow"

      - name: Signal readiness (if secret not set)
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.context.outputs.issue }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gh issue comment $ISSUE --body "Triage GA is present but ANTHROPIC_API_KEY is not set in repo secrets. Set it in Settings -> Secrets and variables -> Actions to enable automated triage (labels + dedup)."
