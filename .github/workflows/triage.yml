name: triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

# Serialize runs per issue so a rapid `opened` + `edited` pair cannot race
# inside `apply_labels`. Both runs read current labels via `gh issue view`
# before computing the remove-set; if they read concurrently and their
# classifications differ (e.g. run A picks `ready`, run B picks `blocked`),
# neither remove-set contains the other's newly-added status label and the
# issue can finish with both `ready` and `blocked` on it — Builder GA then
# treats a blocked issue as actionable. Grouping by issue number and using
# cancel-in-progress: false queues the second run behind the first so
# each pass sees a settled label state (Codex P1 #66).
concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # Hoisted from the individual steps so step-level `if:` expressions can
    # read `env.ANTHROPIC_API_KEY`. A step's `env:` is not in scope at the
    # step's own `if:` evaluation time, so the secret must exist at job level
    # for the gate to evaluate correctly.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirrors review.yml's fork guard. An issue itself is never "from a fork"
      # (issues live on the base repo), but keep the shape symmetric: if this
      # workflow later grows to watch issue_comment on PRs, the guard applies.
      # For now the guard is a no-op that documents the invariant.
      - name: Determine fork status
        id: fork
        run: |
          echo "is_fork=false" >> "$GITHUB_OUTPUT"

      - name: Fetch issue context
        id: context
        if: steps.fork.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          gh issue view $ISSUE_NUM \
            --json number,title,body,url,labels,author,createdAt,state \
            --jq . > /tmp/issue.json
          # Corpus of open issues for dedup analysis. Cap at 100 to bound tokens;
          # if the repo grows past that a follow-up can add labels-based prefiltering.
          gh issue list --state open --limit 100 \
            --json number,title,body,labels,url,createdAt \
            --jq . > /tmp/open-issues.json
          echo "issue=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Load triage context
        if: steps.fork.outputs.is_fork != 'true'
        run: |
          cat AGENTS.md > /tmp/context.md 2>/dev/null || \
            echo "warning: AGENTS.md not present on this branch" >&2
          echo '---' >> /tmp/context.md
          # skill/triage/SKILL.md lands in a follow-up PR; gate on presence
          # (same shape as review.yml's skill/review/SKILL.md load).
          if [ -f skill/triage/SKILL.md ]; then
            cat skill/triage/SKILL.md >> /tmp/context.md
            echo '---' >> /tmp/context.md
          else
            echo "warning: skill/triage/SKILL.md not present on this branch — skipping skill context load" >&2
          fi
          for adr in docs/decisions/*.md; do
            [ -f "$adr" ] && cat "$adr" >> /tmp/context.md
            echo '---' >> /tmp/context.md
          done

      # Real Claude triage. The script categorizes the issue into a fixed
      # label vocabulary (type:*, P1/P2/P3, ready/needs-info/blocked/duplicate),
      # applies the labels via `gh issue edit`, and posts a marker-tagged
      # comment when status is needs-info / blocked / duplicate. `ready`
      # emits the `ready` label which Builder GA gates on — that's the
      # issue-pickup loop closing.
      - name: Install anthropic SDK
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        # Pin the SDK — same reasoning as review.yml (an unpinned install
        # follows any future major and can move the streaming/thinking
        # surface out from under run-triage.py).
        run: python3 -m pip install --quiet 'anthropic==1.4.0'

      - name: Run Claude triage
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON_FILE: /tmp/issue.json
          OPEN_ISSUES_FILE: /tmp/open-issues.json
          CONTEXT_FILE: /tmp/context.md
        run: python3 scripts/run-triage.py

      - name: Signal readiness (if secret not set)
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.context.outputs.issue }}
        run: |
          gh issue comment $ISSUE --body "Triage GA is present but ANTHROPIC_API_KEY is not set in repo secrets. Set it in Settings -> Secrets and variables -> Actions to enable automated triage (labels + dedup)."
