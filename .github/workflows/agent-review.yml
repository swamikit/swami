name: agent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review again
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    # Secrets are withheld from fork pull requests. Keep those safely pending
    # until a maintainer brings the head into this repository or explicitly
    # supplies a trusted review path; never run secret-bearing model review on
    # untrusted fork code via pull_request_target.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false
    uses: samuelalake/agent-factory/.github/workflows/review.yml@43a522970a7370cc855c682f96cc0549f6398f2e
    with:
      pr: ${{ github.event.pull_request.number || inputs.pr }}
      factory_ref: 43a522970a7370cc855c682f96cc0549f6398f2e
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENT_FACTORY_REVIEWER_APP_ID: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_ID }}
      AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY }}

  integration:
    needs: review
    uses: samuelalake/agent-factory/.github/workflows/integration.yml@43a522970a7370cc855c682f96cc0549f6398f2e
    with:
      pr: ${{ github.event.pull_request.number || inputs.pr }}
      factory_ref: 43a522970a7370cc855c682f96cc0549f6398f2e
      timeout_seconds: 1800
    secrets:
      AGENT_FACTORY_STEWARD_APP_ID: ${{ secrets.AGENT_FACTORY_STEWARD_APP_ID }}
      AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY }}
