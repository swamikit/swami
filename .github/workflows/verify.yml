name: verify

# swami pixel gate — Path B (ADR-0013).
# One runner does both sides: installs Origami from its Sparkle appcast, opens
# each pattern to render Origami's reference, then boots SwamiHost's sim to render
# ours, then SSIM-compares. No cross-repo dep, no cached references.
#
# SSIM remains evidence rather than a pixel-perfect verdict (ADR-0014), but a
# catastrophic mismatch is a deterministic failure. Reviewer then judges the
# current-head media and documentation summarized in Builder's PR description.
#
# Assumes: Xcode project at app/Swami.xcodeproj, shared `SwamiHost` scheme,
# SwamiHost's ContentView switching on the `SWAMI_PATTERN` env var.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_PROJECT: app/Swami.xcodeproj
  SCHEME: SwamiHost
  FACTORY_REF: e289051ab01ae059fedef77b8c908d4f872b08d9
  GH_ATTACHMENT_CLI_VERSION: 2.100.0
  GH_ATTACHMENT_CLI_SHA256: 45f9a62da2f6e641a7fad57e2ce39656dfd7ef331372d80a2a2aed65abb01642
  MAESTRO_VERSION: 2.7.0
  MAESTRO_INTERACTION_TIMEOUT_SECONDS: "300"
  VISUAL_SANITY_FLOOR: "0.50"

jobs:
  # Always runs. Cheap ubuntu check that classifies the PR's touched paths so we
  # only pay for macos-15 minutes when the pixel gate can actually catch something.
  # Also gives branch protection something to require on every PR without forcing
  # the expensive job on docs-only changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      patterns: ${{ steps.registry.outputs.patterns }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Agent Factory contract
        uses: actions/checkout@v4
        with:
          repository: samuelalake/agent-factory
          ref: ${{ env.FACTORY_REF }}
          path: factory-contract
          persist-credentials: false
      - name: Validate pinned Factory and consumer config
        run: |
          actual_ref=$(git -C factory-contract rev-parse HEAD)
          test "$actual_ref" = "$FACTORY_REF"
          PYTHONPATH=factory-contract/src python3 -c \
            'from agent_factory.config import load_config; load_config(".agent-factory/config.json")'
      - name: Validate pattern registry
        id: registry
        shell: bash
        run: |
          patterns=""
          while IFS= read -r pair || [ -n "$pair" ]; do
            case "$pair" in
              ""|\#*) continue ;;
            esac
            if [[ ! "$pair" =~ ^[a-z0-9_]+:[A-Za-z0-9_]+$ ]]; then
              echo "Invalid pattern registry entry: $pair (expected [a-z0-9_]+:[A-Za-z0-9_]+)"
              exit 1
            fi
            patterns="${patterns:+$patterns }$pair"
          done < .github/patterns.txt
          if [ -z "$patterns" ]; then
            echo "No entries in .github/patterns.txt"
            exit 1
          fi
          echo "patterns=$patterns" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'tool/src/**'
              - 'tool/**/*.py'
              - '.github/patterns.txt'
              - '**/*.origami'
              - '**/*.origami-config'

  pixel-gate:
    needs: changes
    # Run the expensive gate on: (a) code changes detected by paths-filter, or (b) manual
    # workflow_dispatch so someone can re-verify against a new Origami release without
    # manufacturing a fake code change (Codex P2 catch).
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PATTERNS: ${{ needs.changes.outputs.patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Builder delivery publisher
        uses: actions/checkout@v4
        with:
          repository: samuelalake/agent-factory
          ref: ${{ env.FACTORY_REF }}
          path: factory-delivery
          persist-credentials: false

      - name: Mint Builder installation token
        id: builder-token
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve PR, source head, and changed patterns
        id: evidence
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        env:
          GH_TOKEN: ${{ steps.builder-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.number }}"
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            BRANCH="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                    --json number --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "::warning::no open PR found for head=$BRANCH — delivery publication will be skipped"
              echo "pr=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          CHANGED=""
          changed_count=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.changed_files')
          if ! files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename'); then
            echo "::error::could not enumerate changed PR files; refusing incomplete delivery"
            exit 1
          fi
          observed_count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$observed_count" != "$changed_count" ]; then
            echo "::error::GitHub returned ${observed_count} of ${changed_count} changed files; refusing incomplete delivery"
            exit 1
          fi
          for pair in $PATTERNS; do
            stem="${pair##*:}"
            if printf '%s\n' "$files" | grep -Fxq "app/Swami/Patterns/${stem}.swift"; then
              CHANGED="${CHANGED:+$CHANGED }$pair"
            fi
          done
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "changed_patterns=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep "iOS "

      - name: Install ImageMagick (for SSIM compare)
        run: |
          # macos-15 runners don't ship with ImageMagick's `compare`; install it.
          brew install imagemagick --quiet
          compare -version | head -1

      - name: Install pinned Maestro interaction driver
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5  /tmp/maestro.zip" \
            | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d /tmp/maestro
          echo "/tmp/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Install Origami Studio (Sparkle appcast)
        id: origami
        run: |
          appcast="https://www.facebook.com/mobile_builds/appcast.xml?app_id=892075810923571&flavor=production"
          url=$(curl -sL "$appcast" | grep -oE 'url="[^"]*\.dmg[^"]*"' | head -1 | sed 's/^url="//; s/"$//; s/\&amp;/\&/g')
          version=$(curl -sL "$appcast" | grep -oE 'sparkle:shortVersionString="[^"]*"' | head -1 | sed 's/^sparkle:shortVersionString="//; s/"$//')
          echo "==> Origami $version"
          curl -sL -o /tmp/Origami.dmg "$url"
          hdiutil attach -nobrowse -quiet /tmp/Origami.dmg
          MOUNT=$(ls -d "/Volumes/"* | grep -i origami | head -1)
          sudo cp -R "$MOUNT/Origami Studio.app" /Applications/
          hdiutil detach "$MOUNT" -quiet
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f -R -domain local -domain system "/Applications/Origami Studio.app" 2>&1 | tail -3 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Origami Studio.app" 2>&1 || true
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render Origami references (drives sim dims)
        id: origami-renders
        env:
          CHANGED_PATTERNS: ${{ steps.evidence.outputs.changed_patterns }}
        run: |
          # Render Origami's side of every pattern BEFORE picking the sim, so the sim
          # picker can size the SwiftUI runner to the exact pixel dimensions Origami
          # produces (Codex P1 follow-on to PR #16). This is the dims-first flip: the
          # earlier ordering rendered Origami inside the compare loop, forcing the sim
          # to be picked blind (tier heuristic). We now:
          #
          #   1. Fetch + render each Origami reference here.
          #   2. `sips` the PRIMARY pattern's PNG → publish `target_width`/`target_height`.
          #   3. Sim-picker step keys off those dims (exact equality); tier ranking is
          #      the tiebreaker / fallback when the target is unknown or no sim matches.
          #
          # Primary = the changed pattern for a one-pattern PR; registry order is the
          # fallback for pushes and control-plane changes. If that render misses, we
          # degrade to any pattern that did render. If none rendered, the sim picker
          # falls back to pure tier ranking.
          mkdir -p out/origami
          RUN_PATTERNS="${CHANGED_PATTERNS:-$PATTERNS}"

          for pair in $RUN_PATTERNS; do
            slug="${pair%%:*}"
            stem="${pair##*:}"
            src_url="https://origami.design/public/origami_files/patterns/${stem}.origami"
            echo "==> Rendering ${slug} (${stem})"

            curl -sL -o "/tmp/${stem}.origami" "$src_url"
            if ! [ -s "/tmp/${stem}.origami" ]; then
              echo "  fetch failed for $src_url"
              continue
            fi

            marker=$(mktemp); touch "$marker"; sleep 0.5
            open -a "/Applications/Origami Studio.app" "/tmp/${stem}.origami"
            sleep 12
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to set frontmost to true' \
              -e 'delay 0.5' \
              -e 'tell application "System Events" to tell process "Origami Studio" to tell menu bar 1 to tell menu "View" to click menu item "Take Screenshot"' \
              || echo "  osascript click failed"
            sleep 3
            shot=$(find ~/Desktop -maxdepth 1 -name "Origami-Studio Screenshot*.png" -newer "$marker" 2>/dev/null | head -1)
            if [ -z "$shot" ]; then
              echo "  MISS: no Origami screenshot for ${slug}"
              rm -f "$marker"; continue
            fi
            mv "$shot" "out/origami/${slug}.png"
            rm -f "$marker"

            # Close doc so next pattern gets a clean slate
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to keystroke "w" using command down' \
              -e 'delay 0.4' \
              -e 'try' \
              -e '  tell application "System Events" to tell process "Origami Studio" to click button "Don''t Save" of sheet 1 of window 1' \
              -e 'end try' \
              || true
            sleep 0.5
          done

          # A one-pattern delivery must use that pattern's reference dimensions.
          # Registry order is only the fallback for pushes or control-plane PRs.
          first_slug="${RUN_PATTERNS%%:*}"
          target_png="out/origami/${first_slug}.png"
          if [ ! -f "$target_png" ]; then
            target_png=$(ls out/origami/*.png 2>/dev/null | head -1 || true)
          fi
          if [ -n "$target_png" ] && [ -f "$target_png" ]; then
            W=$(sips -g pixelWidth  "$target_png" | awk '/pixelWidth:/  { print $2 }')
            H=$(sips -g pixelHeight "$target_png" | awk '/pixelHeight:/ { print $2 }')
            echo "  target dims: ${W}x${H}  (from $target_png)"
            echo "target_width=$W"  >> "$GITHUB_OUTPUT"
            echo "target_height=$H" >> "$GITHUB_OUTPUT"
          else
            echo "no Origami PNG rendered — sim picker will fall back to tier ranking"
          fi

      - name: Pick + boot a simulator
        id: sim
        env:
          TARGET_W: ${{ steps.origami-renders.outputs.target_width }}
          TARGET_H: ${{ steps.origami-renders.outputs.target_height }}
        run: |
          # Rank the scheme's valid iOS-Simulator destinations dims-first, tier-second
          # (Codex P1). The primary sort key is exact equality with Origami's rendered
          # PNG dimensions: a sim whose native pixel resolution matches wins, regardless
          # of tier or model number. If the target dims are unknown (Origami didn't
          # render) OR no sim matches, we fall back to PR #16's tier ranking:
          #
          #   Tier order (highest first): Pro Max = Plus > Pro > plain iPhone > Air > SE.
          #   Tiebreak: model number descending (iPhone 17 Pro Max beats iPhone 16 Pro Max).
          #
          # This retires the tier-only heuristic's known miss: on the current runner
          # image `iPhone 17 Pro Max` (1320×2868) outranks `iPhone 15 Plus` (1290×2796)
          # by tier + model, but Origami renders `Interaction_Touch` at 1290×2796, so
          # the 15 Plus is the correct pick. Dims-first surfaces that.
          #
          # The device→native-resolution table is embedded in awk. When Apple ships a
          # new iPhone form factor, add a row; unmatched sims still rank correctly by
          # tier (their dm lookup returns "" so match_score=0 and they fall through).
          #
          # `set +e ... set -e` around the command substitution (Codex P2): with the
          # step's default `-eo pipefail`, a nonzero exit from `xcodebuild` or any
          # stage of the pipeline would kill the step before the fallback runs.

          set +e
          UDID=$(xcodebuild -showdestinations \
                   -project "$APP_PROJECT" -scheme "$SCHEME" 2>/dev/null \
            | awk -v target="${TARGET_W}x${TARGET_H}" '
                BEGIN {
                  # Portrait native pixel resolutions of currently-shipping iPhone sims
                  # (iOS 26.2 lineup; longest-prefix match handles suffixes like
                  # "(3rd generation)").
                  dims["iPhone 17 Pro Max"]          = "1320x2868"
                  dims["iPhone 17 Pro"]              = "1206x2622"
                  dims["iPhone 17 Plus"]             = "1320x2868"
                  dims["iPhone 17 Air"]              = "1260x2736"
                  dims["iPhone 17"]                  = "1206x2622"
                  dims["iPhone 16 Pro Max"]          = "1320x2868"
                  dims["iPhone 16 Pro"]              = "1206x2622"
                  dims["iPhone 16 Plus"]             = "1290x2796"
                  dims["iPhone 16"]                  = "1179x2556"
                  dims["iPhone 15 Pro Max"]          = "1290x2796"
                  dims["iPhone 15 Pro"]              = "1179x2556"
                  dims["iPhone 15 Plus"]             = "1290x2796"
                  dims["iPhone 15"]                  = "1179x2556"
                  dims["iPhone 14 Pro Max"]          = "1290x2796"
                  dims["iPhone 14 Pro"]              = "1179x2556"
                  dims["iPhone 14 Plus"]             = "1284x2778"
                  dims["iPhone 14"]                  = "1170x2532"
                  dims["iPhone SE (3rd generation)"] = "750x1334"
                }
                function lookupDims(n,    k, best, bestlen) {
                  best = ""; bestlen = 0
                  for (k in dims) {
                    if (index(n, k) == 1 && length(k) > bestlen) {
                      best = dims[k]; bestlen = length(k)
                    }
                  }
                  return best
                }
                /platform:iOS Simulator/ {
                  id=""; name=""
                  if (match($0, /id:[^,]+/))   { id   = substr($0, RSTART+3, RLENGTH-3) }
                  if (match($0, /name:[^}]+/)) { name = substr($0, RSTART+5, RLENGTH-5) }
                  gsub(/^ +| +$/, "", id)
                  gsub(/^ +| +$/, "", name)
                  if (id == "" || name == "") next
                  # Skip xcodebuild placeholder entries (e.g. "Any iOS Simulator
                  # Device"). Their id starts with `dvtdevice-` and, when no sim
                  # matches the target dims, they tie with real sims at 0 0 0
                  # and can win the sort — xcodebuild then errors with
                  # "Unable to find a device matching the provided destination
                  # specifier" (exit 70). Seen on PR #28 run 33931390819 and
                  # PR #29 run 33931392044.
                  if (index(id, "dvtdevice-") == 1) next

                  # Dims match against Origami PNG (primary key). "x" (both empty)
                  # means we have no target — every sim scores 0 and tier decides.
                  dm = lookupDims(name)
                  match_score = (target != "x" && dm != "" && dm == target) ? 1 : 0

                  # Tier fallback (as in PR #16). Pro Max and Plus share tier 4 —
                  # same native pixel width. Air sits below plain iPhone (narrower).
                  tier = 2
                  if      (name ~ /Pro Max/) tier = 4
                  else if (name ~ /Plus/)    tier = 4
                  else if (name ~ /Pro/)     tier = 3
                  else if (name ~ /Air/)     tier = 1
                  else if (name ~ /SE/)      tier = 0

                  # Model number = integer right after "iPhone " (not just first
                  # digits anywhere; avoids "SE (3rd generation)" → 3).
                  model = 0
                  if (match(name, /iPhone[ ]+[0-9]+/)) {
                    tok = substr(name, RSTART, RLENGTH)
                    sub(/^iPhone[ ]+/, "", tok)
                    model = tok + 0
                  }
                  printf "%d\t%d\t%d\t%s\t%s\n", match_score, tier, model, id, name
                }
              ' \
            | sort -k1,1nr -k2,2nr -k3,3nr \
            | head -n1 \
            | cut -f4)
          set -e

          if [ -z "$UDID" ]; then
            echo "  showdestinations ranking produced nothing — falling back to alphabetic pick"
            UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];ios=sorted(k for k in d if 'iOS' in k);devs=[x for k in ios for x in d[k] if x.get('isAvailable') and 'iPhone' in x['name']];print(devs[-1]['udid'] if devs else '')")
          fi
          test -n "$UDID" || { echo 'No iOS simulator on this runner image'; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build SwamiHost (once)
        run: |
          set -o pipefail
          xcodebuild build -project "$APP_PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install SwamiHost to sim
        id: app
        run: |
          APP=$(find build/Build/Products -name 'SwamiHost.app' -maxdepth 3 | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          echo "bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: Render SwamiHost + compare per pattern
        id: verify
        env:
          CHANGED_PATTERNS: ${{ steps.evidence.outputs.changed_patterns }}
        run: |
          # Origami's side is already rendered by the earlier "Render Origami references"
          # step (dims-first sim pick depends on it). This step handles the SwamiHost
          # side and the per-pattern SSIM compare.
          mkdir -p out/swami out/diff
          RESULTS=""
          RUN_PATTERNS="${CHANGED_PATTERNS:-$PATTERNS}"

          for pair in $RUN_PATTERNS; do
            slug="${pair%%:*}"
            stem="${pair##*:}"
            echo "==> ${slug} (${stem})"

            # If Origami missed earlier (fetch or render failure), record and skip —
            # nothing to compare against.
            if [ ! -f "out/origami/${slug}.png" ]; then
              echo "  Origami render missing for ${slug} — nothing to compare against"
              RESULTS="${RESULTS}| ${slug} | ORIGAMI RENDER FAILED |"$'\n'
              continue
            fi

            # SwamiHost side: launch with slug, screenshot
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "${{ steps.app.outputs.bid }}" 2>/dev/null || true
            SIMCTL_CHILD_SWAMI_PATTERN="$slug" xcrun simctl launch "${{ steps.sim.outputs.udid }}" "${{ steps.app.outputs.bid }}"
            sleep 3
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "out/swami/${slug}.png"

            # ImageMagick can emit an unnormalized value followed by normalized
            # SSIM in parentheses. Publish and gate on the normalized 0...1 value.
            raw_score=$(compare -metric SSIM "out/swami/${slug}.png" "out/origami/${slug}.png" "out/diff/${slug}.png" 2>&1 || true)
            score=$(printf '%s' "$raw_score" | sed -nE 's/.*\(([0-9]+([.][0-9]+)?)\).*/\1/p')
            if [ -z "$score" ]; then
              score=$(printf '%s' "$raw_score" | grep -oE '[0-9]+([.][0-9]+)?' | tail -1 || true)
            fi
            score="${score:-0}"
            sanity=$(awk -v score="$score" -v floor="$VISUAL_SANITY_FLOOR" 'BEGIN { print (score >= floor) ? "pass" : "fail" }')
            echo "  normalized SSIM $score — catastrophic sanity $sanity"
            RESULTS="${RESULTS}| ${slug} | ${score} | ${sanity} |"$'\n'
          done

          {
            echo "results<<COMPARE_EOF"
            echo "$RESULTS"
            echo "COMPARE_EOF"
            echo "origami_version=${{ steps.origami.outputs.version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pixel-gate, path: out/, if-no-files-found: warn }

      - name: Record changed interaction patterns
        if: steps.evidence.outputs.pr != '' && contains(steps.evidence.outputs.changed_patterns, 'drag:Interaction_Drag')
        env:
          APP_ID: ${{ steps.app.outputs.bid }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p out/recordings
          cat > /tmp/interaction-drag.yaml <<EOF
          appId: ${APP_ID}
          ---
          - swipe:
              start: 50%, 50%
              end: 82%, 28%
              duration: 1200
          - waitForAnimationToEnd
          - swipe:
              start: 50%, 50%
              end: 18%, 72%
              duration: 1200
          - waitForAnimationToEnd
          EOF
          xcrun simctl terminate "$UDID" "$APP_ID" 2>/dev/null || true
          SIMCTL_CHILD_SWAMI_PATTERN=drag xcrun simctl launch "$UDID" "$APP_ID"
          sleep 2
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/recordings/drag.mp4 &
          recorder_pid=$!
          trap 'kill -INT "$recorder_pid" 2>/dev/null || true; wait "$recorder_pid" 2>/dev/null || true' EXIT
          python3 - "$UDID" "$MAESTRO_INTERACTION_TIMEOUT_SECONDS" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["maestro", "--device", sys.argv[1], "test", "/tmp/interaction-drag.yaml"],
              check=True,
              timeout=int(sys.argv[2]),
          )
          PY
          kill -INT "$recorder_pid"
          wait "$recorder_pid" || true
          trap - EXIT
          test -s out/recordings/drag.mp4

      - name: Install pinned GitHub CLI attachment client
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) && steps.evidence.outputs.pr != '' && steps.evidence.outputs.changed_patterns != ''
        run: |
          set -euo pipefail
          archive="/tmp/gh_${GH_ATTACHMENT_CLI_VERSION}_macOS_arm64.zip"
          install_root="/tmp/gh-cli-${GH_ATTACHMENT_CLI_VERSION}"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_ATTACHMENT_CLI_VERSION}/gh_${GH_ATTACHMENT_CLI_VERSION}_macOS_arm64.zip"
          printf '%s  %s\n' "$GH_ATTACHMENT_CLI_SHA256" "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$install_root"
          cli_dir="$install_root/gh_${GH_ATTACHMENT_CLI_VERSION}_macOS_arm64/bin"
          "$cli_dir/gh" pr edit --help | grep -- '--attach' >/dev/null
          echo "$cli_dir" >> "$GITHUB_PATH"

      - name: Publish canonical Builder delivery into the PR description
        id: builder-delivery
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)) && steps.evidence.outputs.pr != '' && steps.evidence.outputs.changed_patterns != ''
        env:
          GH_TOKEN: ${{ steps.builder-token.outputs.token }}
          PR: ${{ steps.evidence.outputs.pr }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.evidence.outputs.sha }}
          CHANGED_PATTERNS: ${{ steps.evidence.outputs.changed_patterns }}
          RESULTS: ${{ steps.verify.outputs.results }}
          ORIGAMI_VERSION: ${{ steps.verify.outputs.origami_version }}
        run: |
          set -euo pipefail
          SITE_REPO="${REPO#*/}"
          DOCC_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${SITE_REPO}/pr-${PR}/documentation/swami/"
          DOCC_HEAD_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${SITE_REPO}/pr-${PR}/.agent-factory-head"
          docc_status="failed"
          for attempt in $(seq 1 180); do
            published_head=$(curl -fsSL "$DOCC_HEAD_URL" 2>/dev/null || true)
            if [ "$published_head" = "$SHA" ] && [ "$(curl -sL -o /dev/null -w '%{http_code}' "$DOCC_URL")" = "200" ]; then
              docc_status="ready"
              break
            fi
            sleep 10
          done

          BODY="Current head: \`${SHA:0:7}\` · [DocC preview](${DOCC_URL})"$'\n\n'
          BODY+="Builder changed and verified only the current pattern work listed below. No unrelated pattern media is included."$'\n\n'
          BODY+="- DocC: **${docc_status}**"$'\n'
          overall="ready"
          ATTACHMENTS=()
          for pair in $CHANGED_PATTERNS; do
            slug="${pair%%:*}"
            stem="${pair##*:}"
            score=$(printf '%s\n' "$RESULTS" | awk -F'|' -v wanted="$slug" '$2 ~ "^[[:space:]]*" wanted "[[:space:]]*$" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3; exit}')
            sanity=$(printf '%s\n' "$RESULTS" | awk -F'|' -v wanted="$slug" '$2 ~ "^[[:space:]]*" wanted "[[:space:]]*$" {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $4); print $4; exit}')
            [ "$sanity" = "pass" ] || overall="failed"
            BODY+="### ${stem}"$'\n\n'
            BODY+="Changed: \`app/Swami/Patterns/${stem}.swift\` · Origami ${ORIGAMI_VERSION} · normalized SSIM ${score:-unavailable} · catastrophic sanity **${sanity:-failed}**"$'\n\n'
            BODY+="| Swami | Origami | Diff |"$'\n'"|---|---|---|"$'\n'
            BODY+="| ![Swami ${stem}](out/swami/${slug}.png) | ![Origami ${stem}](out/origami/${slug}.png) | ![Difference for ${stem}](out/diff/${slug}.png) |"$'\n\n'
            ATTACHMENTS+=(--attach "out/swami/${slug}.png" --attach "out/origami/${slug}.png" --attach "out/diff/${slug}.png")
            if [ -s "out/recordings/${slug}.mp4" ]; then
              BODY+="#### Interaction recording"$'\n\n'"![](out/recordings/${slug}.mp4)"$'\n\n'
              ATTACHMENTS+=(--attach "out/recordings/${slug}.mp4")
            elif [ "$slug" = "drag" ]; then
              BODY+="Interaction recording: **missing**"$'\n\n'
              overall="failed"
            fi
          done
          [ "$docc_status" = "ready" ] || overall="failed"
          printf '%s' "$BODY" > /tmp/builder-delivery.md
          PYTHONPATH=factory-delivery/src python3 -m agent_factory.github_delivery \
            --repo "$REPO" --pr "$PR" --head "$SHA" --status "$overall" \
            --body-file /tmp/builder-delivery.md "${ATTACHMENTS[@]}"
          echo "status=$overall" >> "$GITHUB_OUTPUT"

      - name: Enforce current-head delivery sanity
        if: steps.evidence.outputs.pr != '' && steps.evidence.outputs.changed_patterns != ''
        run: |
          test "${{ steps.builder-delivery.outputs.status }}" = "ready" || {
            echo "::error::Builder delivery is not reviewable; inspect the canonical PR description"
            exit 1
          }

      - name: Explain fork evidence policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::Builder evidence publication is withheld for fork-authored code because GitHub App secrets are unavailable to untrusted pull requests. Maintainers can inspect the workflow artifact and re-run the trusted path after bringing the head into this repository."
          {
            echo "## Fork evidence policy"
            echo
            echo "Builder evidence and the PR DocC publication are withheld because this pull request originates from a fork. The verification artifact remains available to maintainers. Bring the head into this repository, then dispatch the trusted workflow to publish attributed evidence."
          } >> "$GITHUB_STEP_SUMMARY"

