name: verify

# swami pixel gate + DocC screenshot — Path B (ADR-0013).
# One macos-15 runner does everything: installs Origami from its Sparkle appcast,
# builds SwamiHost once (generic sim), then per pattern renders Origami's own artboard
# → matches a sim to Origami's device (dimension-driven) → screenshots SwamiHost →
# SSIM diffs. DocC is built + screenshotted headlessly via Playwright + posted in
# the same sticky comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # push evidence to ci-screenshots branch
  pull-requests: write   # sticky comment onto the PR

env:
  APP_PROJECT: app/Swami.xcodeproj
  APP_SCHEME: SwamiHost
  DOC_SCHEME: Swami
  # <slug>:<origami-file-stem>. slug drives SWAMI_PATTERN + our screenshot naming;
  # stem resolves to https://origami.design/public/origami_files/patterns/<stem>.origami.
  PATTERNS: "touch:Interaction_Touch"
  SSIM_THRESHOLD: "0.95"

jobs:
  pixel-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep "iOS "
          bash --version | head -1

      - name: Install ImageMagick + Playwright deps
        run: |
          brew install imagemagick --quiet
          compare -version | head -1
          # Playwright for headless DocC screenshots
          npm install --silent --prefix /tmp/pw playwright
          /tmp/pw/node_modules/.bin/playwright install chromium --with-deps 2>&1 | tail -3

      - name: Install Origami Studio (Sparkle appcast)
        id: origami
        run: |
          appcast="https://www.facebook.com/mobile_builds/appcast.xml?app_id=892075810923571&flavor=production"
          url=$(curl -sL "$appcast" | grep -oE 'url="[^"]*\.dmg[^"]*"' | head -1 | sed 's/^url="//; s/"$//; s/\&amp;/\&/g')
          version=$(curl -sL "$appcast" | grep -oE 'sparkle:shortVersionString="[^"]*"' | head -1 | sed 's/^sparkle:shortVersionString="//; s/"$//')
          echo "==> Origami $version"
          curl -sL -o /tmp/Origami.dmg "$url"
          hdiutil attach -nobrowse -quiet /tmp/Origami.dmg
          MOUNT=$(ls -d "/Volumes/"* | grep -i origami | head -1)
          sudo cp -R "$MOUNT/Origami Studio.app" /Applications/
          hdiutil detach "$MOUNT" -quiet
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f -R -domain local -domain system "/Applications/Origami Studio.app" 2>&1 | tail -3 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Origami Studio.app" 2>&1 || true
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build SwamiHost (generic sim; installs to per-pattern sims later)
        run: |
          set -o pipefail
          xcodebuild build -project "$APP_PROJECT" -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
          grep -q "BUILD SUCCEEDED" build.log
          APP=$(find build/Build/Products -name 'SwamiHost.app' -maxdepth 3 | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BID=$BID" >> "$GITHUB_ENV"

      - name: Build DocC + headless screenshot
        run: |
          set -o pipefail
          echo "==> docbuild"
          xcodebuild docbuild -project "$APP_PROJECT" -scheme "$DOC_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath docc-build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -8
          ARCHIVE=$(find docc-build -name "*.doccarchive" | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "  no doccarchive produced — DocC screenshot skipped"
            exit 0
          fi
          echo "==> archive: $ARCHIVE"

          mkdir -p out/docc-site out/docc-shots
          # No --hosting-base-path: served at root locally so /js/*, /css/*
          # resolve. Add the flag back only if publishing under a subpath (gh-pages).
          xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
            --output-path out/docc-site 2>&1 | tail -3

          # Tiny Node script: local static server + Playwright screenshot
          cat > /tmp/shoot-docc.js <<'JS'
          const { chromium } = require('playwright');
          const http = require('http'), path = require('path'), fs = require('fs'), url = require('url');
          const ROOT = 'out/docc-site';
          const PORT = 8765;
          const PAGES = [{ name: 'landing', path: '/documentation/swami/' }];
          const types = {'.html':'text/html','.js':'application/javascript','.css':'text/css','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.woff':'font/woff','.woff2':'font/woff2'};
          const server = http.createServer((req, res) => {
            let p = url.parse(req.url).pathname;
            if (p.endsWith('/')) p += 'index.html';
            const file = path.join(ROOT, p);
            fs.readFile(file, (err, data) => {
              if (err) { res.writeHead(404); res.end(); return; }
              res.writeHead(200, {'Content-Type': types[path.extname(file)] || 'application/octet-stream'});
              res.end(data);
            });
          });
          server.listen(PORT);
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              for (const p of PAGES) {
                const target = `http://localhost:${PORT}${p.path}`;
                console.log('  visiting ' + target);
                try {
                  await page.goto(target, { waitUntil: 'networkidle', timeout: 15000 });
                  await page.screenshot({ path: `out/docc-shots/${p.name}.png`, fullPage: true });
                  console.log('  captured ' + p.name);
                } catch (e) { console.log('  ' + p.name + ' failed: ' + e.message); }
              }
            } finally {
              await browser.close();
              server.close();
            }
          })();
          JS
          NODE_PATH=/tmp/pw/node_modules node /tmp/shoot-docc.js || echo "  DocC screenshot failed (non-fatal)"
          ls -la out/docc-shots/ 2>/dev/null || true

      - name: Render + compare per pattern (sim matched to Origami device)
        id: verify
        run: |
          mkdir -p out/origami out/swami out/diff
          RESULTS=""
          FAIL=0

          # Origami dimension → sim device name. Bash-3 compatible (macOS system bash
          # is 3.2 and doesn't support `declare -A`). Extend as new artboard sizes surface.
          dims_to_sim() {
            case "$1" in
              750x1334)   echo "iPhone SE (3rd generation)" ;;
              1170x2532)  echo "iPhone 15" ;;
              1179x2556)  echo "iPhone 16 Pro" ;;
              1290x2796)  echo "iPhone 16 Pro Max" ;;
              *)          echo "" ;;
            esac
          }

          # Find an available sim by exact device name. Prints UDID or empty. Pure bash,
          # no Python heredoc indentation traps.
          find_sim_udid() {
            xcrun simctl list devices available \
              | grep -E "^    $1 \(" \
              | head -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
              | head -1
          }

          for pair in $PATTERNS; do
            slug="${pair%%:*}"
            stem="${pair##*:}"
            src_url="https://origami.design/public/origami_files/patterns/${stem}.origami"
            echo "==> ${slug} (${stem})"

            curl -sL -o "/tmp/${stem}.origami" "$src_url"
            test -s "/tmp/${stem}.origami" || { echo "  fetch failed for $src_url"; RESULTS="${RESULTS}| ${slug} | — | FETCH FAILED | ❌ |"$'\n'; FAIL=1; continue; }

            # Origami: open, hide editor chrome, screenshot, close
            marker=$(mktemp); touch "$marker"; sleep 0.5
            open -a "/Applications/Origami Studio.app" "/tmp/${stem}.origami"
            sleep 12
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to set frontmost to true' \
              -e 'delay 0.5' \
              -e 'try' \
              -e '  tell application "System Events" to tell process "Origami Studio" to tell menu bar 1 to tell menu "View" to click menu item "Hide Interface"' \
              -e 'end try' \
              -e 'delay 0.4' \
              -e 'tell application "System Events" to tell process "Origami Studio" to tell menu bar 1 to tell menu "View" to click menu item "Take Screenshot"' \
              || echo "  osascript click failed"
            sleep 3
            shot=$(find ~/Desktop -maxdepth 1 -name "Origami-Studio Screenshot*.png" -newer "$marker" 2>/dev/null | head -1)
            if [ -z "$shot" ]; then
              echo "  MISS: no Origami screenshot for ${slug}"
              RESULTS="${RESULTS}| ${slug} | — | ORIGAMI RENDER FAILED | ❌ |"$'\n'
              FAIL=1; rm -f "$marker"; continue
            fi
            mv "$shot" "out/origami/${slug}.png"
            rm -f "$marker"

            # Close doc in Origami
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to keystroke "w" using command down' \
              -e 'delay 0.4' \
              -e 'try' \
              -e '  tell application "System Events" to tell process "Origami Studio" to click button "Don''t Save" of sheet 1 of window 1' \
              -e 'end try' \
              || true
            sleep 0.5

            # Read Origami's output dimensions → pick matching sim
            W=$(sips -g pixelWidth "out/origami/${slug}.png" | awk '/pixelWidth/ {print $2}')
            H=$(sips -g pixelHeight "out/origami/${slug}.png" | awk '/pixelHeight/ {print $2}')
            KEY="${W}x${H}"
            DEVICE_NAME=$(dims_to_sim "$KEY")
            if [ -z "$DEVICE_NAME" ]; then
              echo "  WARN: no sim mapped for ${KEY} — falling back to iPhone SE (3rd generation)"
              DEVICE_NAME="iPhone SE (3rd generation)"
            fi
            echo "  Origami rendered at ${KEY} → sim: ${DEVICE_NAME}"

            UDID=$(find_sim_udid "$DEVICE_NAME")
            if [ -z "$UDID" ]; then
              # Loud failure — don't produce partial evidence silently. Log what we DID see
              # so future-us can extend the dims_to_sim map or fix the runner image list.
              echo "::error::No sim UDID for '${DEVICE_NAME}' at ${KEY}. Available iPhone sims:"
              xcrun simctl list devices available | grep -E '^    iPhone' | sed 's/^/  /'
              RESULTS="${RESULTS}| ${slug} | ${DEVICE_NAME} | SIM NOT AVAILABLE | ❌ |"$'\n'
              FAIL=1
              continue
            fi
            xcrun simctl boot "$UDID" 2>/dev/null || true

            # Install app to this sim, launch with slug, screenshot
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            SIMCTL_CHILD_SWAMI_PATTERN="$slug" xcrun simctl launch "$UDID" "$BID"
            sleep 3
            xcrun simctl io "$UDID" screenshot "out/swami/${slug}.png"

            # Perceptual compare. ImageMagick's `compare -metric SSIM` writes to stderr
            # in the form: "<SSIM> (<DSSIM>)" where DSSIM = (1 - SSIM) / 2 per Codex
            # research (Kornel/pixelmatch definition IM adopted). Read the leading value
            # as SSIM directly — simpler and version-tolerant. Log the raw for debugging.
            raw=$(compare -metric SSIM "out/swami/${slug}.png" "out/origami/${slug}.png" "out/diff/${slug}.png" 2>&1 || true)
            echo "  raw compare output: ${raw}"
            ssim=$(echo "$raw" | awk '{print $1+0}')
            verdict=$(awk -v s="$ssim" -v t="$SSIM_THRESHOLD" 'BEGIN{ print (s+0>=t+0 ? "✅" : "❌") }')
            [ "$verdict" = "❌" ] && FAIL=1
            echo "  SSIM ${ssim} → ${verdict}"
            RESULTS="${RESULTS}| ${slug} | ${DEVICE_NAME} | ${ssim} | ${verdict} |"$'\n'
          done

          {
            echo "results<<COMPARE_EOF"
            echo "$RESULTS"
            echo "COMPARE_EOF"
            echo "any_fail=${FAIL}"
            echo "origami_version=${{ steps.origami.outputs.version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-gate
          # Exclude DocC's static-site tree: DocC names JSON files after Swift signatures
          # like `animation(_:).json`, and upload-artifact rejects colons (Windows FS).
          # We only need the rendered PNGs to survive as artifacts.
          path: |
            out/origami/
            out/swami/
            out/diff/
            out/docc-shots/
          if-no-files-found: warn

      - name: Post evidence onto the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BR="ci-screenshots"
          git config user.name "swami-ci"
          git config user.email "ci@swami.local"
          git fetch origin "$BR" && git checkout "$BR" || git checkout --orphan "$BR"
          # Do NOT wipe the branch — preserve prior PRs' evidence. Only overwrite this
          # PR's own pr-N/ dir.
          rm -rf "pr-$PR"
          mkdir -p "pr-$PR"
          cp -R out/* "pr-$PR/" 2>/dev/null || true
          git add "pr-$PR"
          git commit -m "evidence: PR #$PR @ ${SHA:0:7}" || true
          git push origin "$BR"

          RAW="https://raw.githubusercontent.com/${REPO}/${BR}/pr-${PR}"
          BODY="### 📸 Pixel gate — \`${SHA:0:7}\`"$'\n\n'
          BODY+="**SSIM vs Origami ${{ steps.verify.outputs.origami_version }}** (≥${SSIM_THRESHOLD} = ✅)"$'\n\n'
          BODY+="| pattern | sim | SSIM | verdict |"$'\n'"|---|---|---|---|"$'\n'
          BODY+="${{ steps.verify.outputs.results }}"$'\n\n'
          for pair in $PATTERNS; do
            slug="${pair%%:*}"
            BODY+="**${slug}**"$'\n\n'
            BODY+="| Swami | Origami | Diff |"$'\n'"|---|---|---|"$'\n'
            BODY+="| ![swami](${RAW}/swami/${slug}.png) | ![origami](${RAW}/origami/${slug}.png) | ![diff](${RAW}/diff/${slug}.png) |"$'\n\n'
          done
          if [ -f "pr-$PR/docc-shots/landing.png" ]; then
            BODY+="---"$'\n\n'"### 📚 DocC landing"$'\n\n'"![docc-landing](${RAW}/docc-shots/landing.png)"$'\n\n'
          fi
          BODY+="_Static layout only. Interaction gate (drive gesture, compare response) + video side-by-side are separate follow-ups._"
          gh pr comment "$PR" --repo "$REPO" --edit-last --body "$BODY" 2>/dev/null \
            || gh pr comment "$PR" --repo "$REPO" --body "$BODY"

      - name: Final gate
        if: always()
        run: |
          if [ "${{ steps.verify.outputs.any_fail }}" = "1" ]; then
            echo "::error::One or more patterns failed the pixel gate — see sticky comment for details"
            exit 1
          fi

# NEXT (per ADR-0013 + NEEDS-VERIFY): (a) parser IR verification via Origami's Inspector
# AX attributes, (b) interaction gate — XCUITest-drives-both-sides + video side-by-side,
# (c) adversarial-review skill + Review beat.
