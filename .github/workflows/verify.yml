name: verify

# swami pixel gate — Path B (ADR-0013).
# One runner does both sides: installs Origami from its Sparkle appcast, opens
# each pattern to render Origami's reference, then boots SwamiHost's sim to render
# ours, then SSIM-compares. No cross-repo dep, no cached references.
#
# Assumes: Xcode project at app/Swami.xcodeproj, shared `SwamiHost` scheme,
# SwamiHost's ContentView switching on the `SWAMI_PATTERN` env var.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # push renders to the evidence branch
  pull-requests: write   # comment onto the PR

env:
  APP_PROJECT: app/Swami.xcodeproj
  SCHEME: SwamiHost
  # Each entry: <slug>:<origami-file-stem>. slug drives SWAMI_PATTERN + our screenshot
  # naming; stem resolves to https://origami.design/public/origami_files/patterns/<stem>.origami.
  PATTERNS: "touch:Interaction_Touch"
  SSIM_THRESHOLD: "0.95"

jobs:
  pixel-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep "iOS "

      - name: Install ImageMagick (for SSIM compare)
        run: |
          # macos-15 runners don't ship with ImageMagick's `compare`; install it.
          brew install imagemagick --quiet
          compare -version | head -1

      - name: Install Origami Studio (Sparkle appcast)
        id: origami
        run: |
          appcast="https://www.facebook.com/mobile_builds/appcast.xml?app_id=892075810923571&flavor=production"
          url=$(curl -sL "$appcast" | grep -oE 'url="[^"]*\.dmg[^"]*"' | head -1 | sed 's/^url="//; s/"$//; s/\&amp;/\&/g')
          version=$(curl -sL "$appcast" | grep -oE 'sparkle:shortVersionString="[^"]*"' | head -1 | sed 's/^sparkle:shortVersionString="//; s/"$//')
          echo "==> Origami $version"
          curl -sL -o /tmp/Origami.dmg "$url"
          hdiutil attach -nobrowse -quiet /tmp/Origami.dmg
          MOUNT=$(ls -d "/Volumes/"* | grep -i origami | head -1)
          sudo cp -R "$MOUNT/Origami Studio.app" /Applications/
          hdiutil detach "$MOUNT" -quiet
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f -R -domain local -domain system "/Applications/Origami Studio.app" 2>&1 | tail -3 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Origami Studio.app" 2>&1 || true
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pick + boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];ios=sorted(k for k in d if 'iOS' in k);devs=[x for k in ios for x in d[k] if x.get('isAvailable') and 'iPhone' in x['name']];print(devs[-1]['udid'] if devs else '')")
          test -n "$UDID" || { echo 'No iOS simulator on this runner image'; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build SwamiHost (once)
        run: |
          set -o pipefail
          xcodebuild build -project "$APP_PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install SwamiHost to sim
        id: app
        run: |
          APP=$(find build/Build/Products -name 'SwamiHost.app' -maxdepth 3 | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          echo "bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: Render + compare per pattern
        id: verify
        run: |
          mkdir -p out/origami out/swami out/diff
          RESULTS=""
          FAIL=0

          for pair in $PATTERNS; do
            slug="${pair%%:*}"
            stem="${pair##*:}"
            src_url="https://origami.design/public/origami_files/patterns/${stem}.origami"
            echo "==> ${slug} (${stem})"

            # 1. Fetch the .origami file from origami.design (public, no auth)
            curl -sL -o "/tmp/${stem}.origami" "$src_url"
            test -s "/tmp/${stem}.origami" || { echo "  fetch failed for $src_url"; FAIL=1; continue; }

            # 2. Origami side: open, screenshot, close
            marker=$(mktemp); touch "$marker"; sleep 0.5
            open -a "/Applications/Origami Studio.app" "/tmp/${stem}.origami"
            sleep 12
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to set frontmost to true' \
              -e 'delay 0.5' \
              -e 'tell application "System Events" to tell process "Origami Studio" to tell menu bar 1 to tell menu "View" to click menu item "Take Screenshot"' \
              || echo "  osascript click failed"
            sleep 3
            shot=$(find ~/Desktop -maxdepth 1 -name "Origami-Studio Screenshot*.png" -newer "$marker" 2>/dev/null | head -1)
            if [ -z "$shot" ]; then
              echo "  MISS: no Origami screenshot for ${slug}"
              RESULTS="${RESULTS}| ${slug} | ORIGAMI RENDER FAILED | — | ❌ |"$'\n'
              FAIL=1
              rm -f "$marker"; continue
            fi
            mv "$shot" "out/origami/${slug}.png"
            rm -f "$marker"

            # Close doc so next pattern gets a clean slate
            osascript >/dev/null 2>&1 \
              -e 'tell application "System Events" to tell process "Origami Studio" to keystroke "w" using command down' \
              -e 'delay 0.4' \
              -e 'try' \
              -e '  tell application "System Events" to tell process "Origami Studio" to click button "Don''t Save" of sheet 1 of window 1' \
              -e 'end try' \
              || true
            sleep 0.5

            # 3. SwamiHost side: launch with slug, screenshot
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "${{ steps.app.outputs.bid }}" 2>/dev/null || true
            SIMCTL_CHILD_SWAMI_PATTERN="$slug" xcrun simctl launch "${{ steps.sim.outputs.udid }}" "${{ steps.app.outputs.bid }}"
            sleep 3
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "out/swami/${slug}.png"

            # 4. Perceptual SSIM (1.0 identical, closer to 0 = worse)
            score=$(compare -metric SSIM "out/swami/${slug}.png" "out/origami/${slug}.png" "out/diff/${slug}.png" 2>&1 || true)
            verdict=$(awk -v s="$score" -v t="$SSIM_THRESHOLD" 'BEGIN{ print (s+0>=t+0 ? "✅" : "❌") }')
            [ "$verdict" = "❌" ] && FAIL=1
            echo "  SSIM $score → $verdict"
            RESULTS="${RESULTS}| ${slug} | ${score} | ${verdict} |"$'\n'
          done

          {
            echo "results<<COMPARE_EOF"
            echo "$RESULTS"
            echo "COMPARE_EOF"
            echo "any_fail=${FAIL}"
            echo "origami_version=${{ steps.origami.outputs.version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pixel-gate, path: out/, if-no-files-found: warn }

      - name: Post evidence onto the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BR="ci-screenshots"
          git config user.name "swami-ci"
          git config user.email "ci@swami.local"
          # Two paths: (a) branch exists → checkout normally, wipe ONLY this PR's dir so a partial
          # rerun doesn't reuse stale PNGs (Codex P1). (b) branch doesn't exist → checkout --orphan
          # which retains the current PR checkout's index; must `git rm -rf .` to start empty
          # (Codex P2). Never wipe the whole ci-screenshots tree when the branch already exists.
          if git fetch origin "$BR" && git checkout "$BR"; then
            rm -rf "pr-$PR"
          else
            git checkout --orphan "$BR"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "pr-$PR"
          cp -R out/* "pr-$PR/"
          git add "pr-$PR"
          git commit -m "evidence: PR #$PR @ ${SHA:0:7}" || true
          git push origin "$BR"

          RAW="https://raw.githubusercontent.com/${REPO}/${BR}/pr-${PR}"
          BODY="### 📸 Pixel gate — \`${SHA:0:7}\`"$'\n\n'
          BODY+="**SSIM vs Origami ${{ steps.verify.outputs.origami_version }}** (≥${SSIM_THRESHOLD} = ✅)"$'\n\n'
          BODY+="| pattern | SSIM | verdict |"$'\n'"|---|---|---|"$'\n'
          BODY+="${{ steps.verify.outputs.results }}"$'\n\n'
          for pair in $PATTERNS; do
            slug="${pair%%:*}"
            BODY+="**${slug}**"$'\n\n'
            BODY+="| Swami | Origami | Diff |"$'\n'"|---|---|---|"$'\n'
            BODY+="| ![swami](${RAW}/swami/${slug}.png) | ![origami](${RAW}/origami/${slug}.png) | ![diff](${RAW}/diff/${slug}.png) |"$'\n\n'
          done
          BODY+="_Static layout only. Interaction gate (drive gesture, compare response) is separate — ADR-0013 follow-up._"
          gh pr comment "$PR" --repo "$REPO" --edit-last --body "$BODY" 2>/dev/null \
            || gh pr comment "$PR" --repo "$REPO" --body "$BODY"

# NEXT (per ADR-0013): (a) parser-verification step that reads Origami's Inspector via AX
# attributes and diffs against the parser's IR; (b) interaction gate — XCUITest-drives-both-sides
# gesture verification, same evidence-on-PR flow.
