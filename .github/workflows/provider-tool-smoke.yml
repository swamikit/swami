name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@ced51f6c8f67b69080125cfb21f712c9b9a1ef1d
    with:
      factory_ref: ced51f6c8f67b69080125cfb21f712c9b9a1ef1d
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@ced51f6c8f67b69080125cfb21f712c9b9a1ef1d
    with:
      factory_ref: ced51f6c8f67b69080125cfb21f712c9b9a1ef1d
      provider: openrouter
      models: cohere/north-mini-code:free
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
