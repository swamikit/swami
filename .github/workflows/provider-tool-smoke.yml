name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@65ec647c1af331e5126db099f6f37c218c45704c
    with:
      factory_ref: 65ec647c1af331e5126db099f6f37c218c45704c
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter-primary:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@65ec647c1af331e5126db099f6f37c218c45704c
    with:
      factory_ref: 65ec647c1af331e5126db099f6f37c218c45704c
      provider: openrouter
      models: qwen/qwen3.8-max-0902
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 2
      output_cost_per_million: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  openrouter-fallback:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@65ec647c1af331e5126db099f6f37c218c45704c
    with:
      factory_ref: 65ec647c1af331e5126db099f6f37c218c45704c
      provider: openrouter
      models: openai/gpt-5.6-sol
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 2
      output_cost_per_million: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
