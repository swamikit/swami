name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@e7002ddfb088298ebc143a58b781940b433b939b
    with:
      factory_ref: e7002ddfb088298ebc143a58b781940b433b939b
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter-primary:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@e7002ddfb088298ebc143a58b781940b433b939b
    with:
      factory_ref: e7002ddfb088298ebc143a58b781940b433b939b
      provider: openrouter
      models: z-ai/glm-5.3-flash
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 2
      output_cost_per_million: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  openrouter-fallback:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@e7002ddfb088298ebc143a58b781940b433b939b
    with:
      factory_ref: e7002ddfb088298ebc143a58b781940b433b939b
      provider: openrouter
      models: openai/gpt-5.6-sol
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 2
      output_cost_per_million: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
