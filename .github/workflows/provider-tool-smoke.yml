name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@d74be452b38e6d86891bf666b52b98a84c9f7281
    with:
      factory_ref: d74be452b38e6d86891bf666b52b98a84c9f7281
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
