name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@e289051ab01ae059fedef77b8c908d4f872b08d9
    with:
      factory_ref: e289051ab01ae059fedef77b8c908d4f872b08d9
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@e289051ab01ae059fedef77b8c908d4f872b08d9
    with:
      factory_ref: e289051ab01ae059fedef77b8c908d4f872b08d9
      provider: openrouter
      models: cohere/north-mini-code:free
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
