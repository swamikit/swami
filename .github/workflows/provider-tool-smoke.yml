name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@1fdf9a96a6ff394231ecd5a609ea4e664cbb3adc
    with:
      factory_ref: 1fdf9a96a6ff394231ecd5a609ea4e664cbb3adc
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@1fdf9a96a6ff394231ecd5a609ea4e664cbb3adc
    with:
      factory_ref: 1fdf9a96a6ff394231ecd5a609ea4e664cbb3adc
      provider: openrouter
      models: z-ai/glm-5.3-flash
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
