name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@ac8e3e45e953149e55ec4d87a5606e31edbe8369
    with:
      factory_ref: ac8e3e45e953149e55ec4d87a5606e31edbe8369
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@ac8e3e45e953149e55ec4d87a5606e31edbe8369
    with:
      factory_ref: ac8e3e45e953149e55ec4d87a5606e31edbe8369
      provider: openrouter
      models: openai/gpt-5.6-sol
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 4
      output_cost_per_million: 15
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
