name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvidia:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@16f81dc3ef19d5959a32a139b392f348df3b099b
    with:
      factory_ref: 16f81dc3ef19d5959a32a139b392f348df3b099b
      provider: nvidia
      models: moonshotai/kimi-k3
      max_candidates: 4
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
