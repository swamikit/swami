name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@8a3fa219bd1d9acba5d3f0059f931eb22159e35e
    with:
      factory_ref: 8a3fa219bd1d9acba5d3f0059f931eb22159e35e
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter-primary:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@8a3fa219bd1d9acba5d3f0059f931eb22159e35e
    with:
      factory_ref: 8a3fa219bd1d9acba5d3f0059f931eb22159e35e
      provider: openrouter
      models: openai/gpt-6-astra
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 10
      output_cost_per_million: 50
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  openrouter-fallback:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@8a3fa219bd1d9acba5d3f0059f931eb22159e35e
    with:
      factory_ref: 8a3fa219bd1d9acba5d3f0059f931eb22159e35e
      provider: openrouter
      models: openai/gpt-5.6-sol
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 10
      output_cost_per_million: 50
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
