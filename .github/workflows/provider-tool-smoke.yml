name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@451fb7683249376ad5fb5a01e04ce09f5c200279
    with:
      factory_ref: 451fb7683249376ad5fb5a01e04ce09f5c200279
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@451fb7683249376ad5fb5a01e04ce09f5c200279
    with:
      factory_ref: 451fb7683249376ad5fb5a01e04ce09f5c200279
      provider: openrouter
      models: openai/gpt-5.4-mini
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
