name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
    paths:
      - .github/workflows/provider-tool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@1f72a5c791c3781dcaa83d92d047e12b6f7fdf00
    with:
      factory_ref: 1f72a5c791c3781dcaa83d92d047e12b6f7fdf00
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@1f72a5c791c3781dcaa83d92d047e12b6f7fdf00
    with:
      factory_ref: 1f72a5c791c3781dcaa83d92d047e12b6f7fdf00
      provider: openrouter
      models: z-ai/glm-5.3-flash,qwen/qwen3.8-flash,inception/mercury-2.5-preview
      max_candidates: 3
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
