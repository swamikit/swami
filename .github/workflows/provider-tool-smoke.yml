name: provider-tool-smoke

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimax:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@2ac05255d381c432bd201f27d52263569e25758e
    with:
      factory_ref: 2ac05255d381c432bd201f27d52263569e25758e
      provider: minimax
      models: MiniMax-M2.7
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  openrouter:
    uses: samuelalake/agent-factory/.github/workflows/provider-smoke.yml@2ac05255d381c432bd201f27d52263569e25758e
    with:
      factory_ref: 2ac05255d381c432bd201f27d52263569e25758e
      provider: openrouter
      models: openai/gpt-5.6-sol
      max_candidates: 1
      builder_shape: true
      max_output_tokens: 2048
      prompt_bytes: 70000
      visual_input: true
      input_cost_per_million: 2
      output_cost_per_million: 10
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
