name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]  # for @claude review re-triggers
  workflow_dispatch:
    # Builder GA's ready-path job opens PRs authenticated with GITHUB_TOKEN,
    # and PRs opened with GITHUB_TOKEN do NOT emit `pull_request` events
    # (GitHub's recursion guard). Without a dispatch entry point, Review GA
    # would never wake on Builder-opened PRs — the exact double-green gate
    # AGENTS.md Beat 3/4 and ADR-0014 put the merge decision behind. Any
    # workflow can call `gh workflow run review.yml -f pr_number=<N>` to
    # trigger Review against a specific PR (Codex P1 round 2).
    inputs:
      pr_number:
        description: 'PR number to review (used when dispatched from another workflow).'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # Codex P2: restrict issue_comment re-triggers to PR comments (issues also fire issue_comment).
    # workflow_dispatch is trusted (only maintainers / other workflows in the
    # base repo can invoke it) and always carries a `pr_number` input by
    # schema, so no extra body-substring gate is needed on that path.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Codex P1: forked pull_request events run without repo secrets and with a read-only
      # GITHUB_TOKEN — Claude can't be called and comments can't be posted. Detect and skip.
      # issue_comment events (even on cross-repo PRs) run in the base repo context and DO
      # have secret access, so they are not gated here.
      - name: Determine PR fork status
        id: fork
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip review on forked PR
        if: steps.fork.outputs.is_fork == 'true'
        run: |
          echo "::notice::Forked PR detected — ANTHROPIC_API_KEY and write permissions are unavailable on fork pull_request events. Skipping Claude review. A maintainer can re-run by commenting '@claude review' on the PR (issue_comment runs in the base repo context and has secret access)."

      - name: Fetch PR context
        id: context
        if: steps.fork.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Resolve PR number from every trigger this workflow accepts:
          # pull_request (auto), issue_comment (comment on PR), or
          # workflow_dispatch (Builder GA's ready-path handoff — Codex P1
          # round 2). Fail loudly if none resolved rather than pass an empty
          # string to `gh pr view` and get a confusing error downstream.
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -eu
          if [ -z "${PR_NUM:-}" ]; then
            echo "::error::no PR number resolved from pull_request / issue_comment / workflow_dispatch payload"
            exit 1
          fi
          gh pr view "$PR_NUM" --json number,title,body,url,headRefName,baseRefName,headRefOid,commits,files --jq . > /tmp/pr.json
          gh pr diff "$PR_NUM" > /tmp/pr.diff
          # Codex P2 (sticky preservation): READ verify.yml's sticky comment for CONTEXT ONLY.
          # Do not edit, update, or delete it here — the pixel gate owns that comment. The
          # Claude review posts SEPARATE comments (see "Run Claude review" step below).
          gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/sticky.md
          # Resolve HEAD_SHA from the PR payload — on workflow_dispatch the
          # github.event.pull_request.* fields are empty. run-claude-review.py
          # treats HEAD_SHA as optional (used only for the sticky "HEAD:"
          # line), but populating it keeps the comment self-documenting.
          HEAD_SHA=$(python3 -c "import json;print(json.load(open('/tmp/pr.json')).get('headRefOid',''))")
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Load review context
        if: steps.fork.outputs.is_fork != 'true'
        run: |
          cat AGENTS.md > /tmp/context.md
          echo '---' >> /tmp/context.md
          # skill/review/SKILL.md lands in a follow-up PR (skill/review-add); gate on presence
          if [ -f skill/review/SKILL.md ]; then
            cat skill/review/SKILL.md >> /tmp/context.md
            echo '---' >> /tmp/context.md
          else
            echo "warning: skill/review/SKILL.md not present on this branch — skipping skill context load" >&2
          fi
          for adr in docs/decisions/*.md; do cat "$adr" >> /tmp/context.md; echo '---' >> /tmp/context.md; done

      # The Claude review posts its findings as a SEPARATE marker-tagged sticky
      # comment (<!-- claude-review -->) and NEVER edits verify.yml's pixel-gate
      # sticky. Subsequent runs update the same claude-review comment in place,
      # so this doesn't pile up new comments across pushes (Codex P2).
      - name: Install anthropic SDK
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Pin the SDK: an unpinned `pip install anthropic` silently follows any
        # future major bump and can move the surface out from under the
        # streaming/thinking call in run-claude-review.py. Bump this pin
        # deliberately when we've verified the new major behaves.
        run: python3 -m pip install --quiet 'anthropic==1.4.0'

      - name: Run Claude review
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
          # Prefer the fetch-step's resolved sha (works on all three trigger
          # shapes) and fall back to the pull_request event field for parity
          # with older payloads that predated the workflow_dispatch entry
          # point.
          HEAD_SHA: ${{ steps.context.outputs.head_sha || github.event.pull_request.head.sha }}
          PR_DIFF_FILE: /tmp/pr.diff
          STICKY_FILE: /tmp/sticky.md
        run: python3 scripts/run-claude-review.py

      - name: Signal readiness (if secret not set)
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gh pr comment $PR --body "Review GA is present but ANTHROPIC_API_KEY is not set in repo secrets. Set it in Settings -> Secrets and variables -> Actions to enable automated review."
