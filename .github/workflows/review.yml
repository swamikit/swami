name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]  # for @claude review re-triggers
  workflow_dispatch:
    # Builder GA's ready-path job opens PRs authenticated with GITHUB_TOKEN,
    # and PRs opened with GITHUB_TOKEN do NOT emit `pull_request` events
    # (GitHub's recursion guard). Without a dispatch entry point, Review GA
    # would never wake on Builder-opened PRs — the exact double-green gate
    # AGENTS.md Beat 3/4 and ADR-0014 put the merge decision behind. Any
    # workflow can call `gh workflow run review.yml -f pr_number=<N>` to
    # trigger Review against a specific PR (Codex P1 round 2).
    inputs:
      pr_number:
        description: 'PR number to review (used when dispatched from another workflow).'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

# Codex P1 round 2: serialize review.yml runs per PR. Two runs racing
# (rapid pushes, manual retrigger while the previous run is still in
# flight) let the older run finish LAST, dismiss the newer bot review,
# and submit a verdict for the OLDER diff — approving code that no
# longer exists at HEAD. `cancel-in-progress: true` kills the older run
# the moment a newer trigger fires; the newer run then owns the PR's
# review. Belt-and-suspenders: run-claude-review.py also re-fetches HEAD
# immediately before POST and aborts if it has moved,
# so a race that beats the concurrency gate still doesn't ship a stale
# verdict.
#
# Partition triggers by "actionable" vs "ignorable" so that comments
# unrelated to the review (Codex posting its summary, a human replying to
# a diff comment, etc.) can't cancel the in-flight actionable run — while
# preserving the round-2 property that a newer actionable run cancels an
# older one:
#
#   Actionable — pull_request, workflow_dispatch, and @claude-review
#   issue_comment. All of these change the verdict, so they share one
#   group `review-<PR>` and cancel each other correctly (newer wins).
#
#   Ignorable — every other issue_comment. Each is given its own
#   per-comment group `review-<PR>-ignorable-<comment-id>` so it (a)
#   never touches the actionable group, and (b) still de-duplicates
#   same-comment edit/delete churn among itself. The job-level `if:`
#   would skip these anyway — but concurrency evaluates BEFORE `if:`,
#   so without the partition the ignorable run cancels the actionable
#   one and then never posts anything itself. Test PR #79 hit exactly
#   this: Codex posted a comment ~6s into the pull_request run and
#   cancelled the quibble review mid-flight (Codex P1 on this PR).
#
# The prior HEAD-SHA-based partition (fix round 1 on this PR) fixed the
# wrong axis: it put actionable triggers (pull_request/synchronize vs
# workflow_dispatch vs @claude review comment) into DIFFERENT groups,
# so an older actionable run could finish LAST and dismiss the newer
# verdict — exactly the race the round-2 fix on PR #75 was written to
# prevent.
#
# `inputs.pr_number` covers the workflow_dispatch shape (Builder GA's
# ready-path handoff — pull_request / issue_comment payloads are empty
# on that trigger).
concurrency:
  group: >-
    review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}${{ (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '@claude review')) && format('-ignorable-{0}', github.event.comment.id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Codex P2: restrict issue_comment re-triggers to PR comments (issues also fire issue_comment).
    # workflow_dispatch is trusted (only maintainers / other workflows in the
    # base repo can invoke it) and always carries a `pr_number` input by
    # schema, so no extra body-substring gate is needed on that path.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    # One thorough model pass is the only Quibble review.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # `quibble-review` GitHub App credentials — the review scripts mint an
      # installation access token from these so review comments post as
      # `quibble-review[bot]` instead of `github-actions[bot]`. When either
      # secret is unset the scripts log a `::warning` and fall back to
      # GITHUB_TOKEN, so a rotation gap doesn't take reviews offline.
      QUIBBLE_APP_ID: ${{ secrets.QUIBBLE_APP_ID }}
      QUIBBLE_APP_PRIVATE_KEY: ${{ secrets.QUIBBLE_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fetch PR context BEFORE the fork gate so we can compute fork-ness
      # from the fetched PR (correct on all three triggers) instead of the
      # `pull_request` event payload alone (which is empty on
      # workflow_dispatch — Claude sticky P1 round 3). Reading a PR's
      # metadata via `gh pr view` doesn't execute any user-supplied code, so
      # doing it before the fork check is safe.
      - name: Fetch PR context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          # Resolve PR number from every trigger this workflow accepts:
          # pull_request (auto), issue_comment (comment on PR), or
          # workflow_dispatch (Builder GA's ready-path handoff — Codex P1
          # round 2). Fail loudly if none resolved rather than pass an empty
          # string to `gh pr view` and get a confusing error downstream.
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -eu
          if [ -z "${PR_NUM:-}" ]; then
            echo "::error::no PR number resolved from pull_request / issue_comment / workflow_dispatch payload"
            exit 1
          fi
          # `headRepositoryOwner` is what the fork gate below compares
          # against `github.repository_owner`. Without it a dispatched or
          # commented review of a fork PR bypasses the fork check silently
          # (Claude sticky P1 round 3).
          gh pr view "$PR_NUM" --json number,title,body,url,headRefName,baseRefName,headRefOid,headRepositoryOwner,commits,files --jq . > /tmp/pr.json
          gh pr diff "$PR_NUM" > /tmp/pr.diff
          # Codex P2 (sticky preservation): READ verify.yml's sticky comment for CONTEXT ONLY.
          # Do not edit, update, or delete it here — the pixel gate owns that comment. The
          # Quibble posts a separate formal review (see "Run Quibble review" below).
          gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/sticky.md
          # Resolve HEAD_SHA from the PR payload — on workflow_dispatch the
          # github.event.pull_request.* fields are empty. run-claude-review.py
          # treats HEAD_SHA as optional (used only for the sticky "HEAD:"
          # line), but populating it keeps the comment self-documenting.
          HEAD_SHA=$(python3 -c "import json;print(json.load(open('/tmp/pr.json')).get('headRefOid',''))")
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Fork detection using the fetched PR JSON so it is correct on all
      # three triggers. Compare the head repo's owner login to the base
      # repo's owner: a different owner is a fork, from any owner (user or
      # org). Empty owner (unlikely — `gh pr view` populates it) falls
      # through to non-fork so we don't refuse a legit PR on a JSON parse
      # hiccup. Codex P1 round 3: the previous step read
      # `github.event.pull_request.head.repo.fork` which is empty on
      # `workflow_dispatch`, so a dispatched review of a fork PR silently
      # bypassed this gate.
      - name: Determine PR fork status
        id: fork
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          HEAD_OWNER=$(python3 -c "import json;d=json.load(open('/tmp/pr.json'));o=d.get('headRepositoryOwner') or {};print(o.get('login',''))")
          if [ -n "$HEAD_OWNER" ] && [ "$HEAD_OWNER" != "$REPO_OWNER" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip review on forked PR
        if: steps.fork.outputs.is_fork == 'true'
        run: |
          echo "::notice::Forked PR detected — Quibble review skipped. On pull_request the fork's model credential and write permissions are unavailable; on workflow_dispatch / issue_comment we refuse a fork explicitly so an untrusted diff can't reach a job holding base-repo secrets."

      - name: Load review context
        if: steps.fork.outputs.is_fork != 'true'
        run: |
          cat AGENTS.md > /tmp/context.md
          echo '---' >> /tmp/context.md
          # skill/review/SKILL.md lands in a follow-up PR (skill/review-add); gate on presence
          if [ -f skill/review/SKILL.md ]; then
            cat skill/review/SKILL.md >> /tmp/context.md
            echo '---' >> /tmp/context.md
          else
            echo "warning: skill/review/SKILL.md not present on this branch — skipping skill context load" >&2
          fi
          for adr in docs/decisions/*.md; do cat "$adr" >> /tmp/context.md; echo '---' >> /tmp/context.md; done

      # Quibble posts one marker-tagged formal review and never edits the
      # evidence comment owned by verify.yml.
      - name: Install review SDKs
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        # Pin every SDK: an unpinned `pip install` silently follows future major
        # bumps and can move the surface out from under run-claude-review.py.
        # Bump these pins deliberately when we've verified the new major behaves.
        #   anthropic -> Claude Opus review
        #   PyJWT + cryptography -> quibble-review App installation-token minting
        #     (scripts/gh_app_auth.py). Same pin discipline: bump deliberately
        #     when we've verified the new majors of PyJWT / cryptography behave.
        run: python3 -m pip install --quiet 'anthropic==1.4.0' 'PyJWT==2.9.0' 'cryptography==43.0.3'

      - name: Run Quibble review
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
          # Prefer the fetch-step's resolved sha (works on all three trigger
          # shapes) and fall back to the pull_request event field for parity
          # with older payloads that predated the workflow_dispatch entry
          # point.
          HEAD_SHA: ${{ steps.context.outputs.head_sha || github.event.pull_request.head.sha }}
          PR_DIFF_FILE: /tmp/pr.diff
          STICKY_FILE: /tmp/sticky.md
        run: python3 scripts/run-claude-review.py

      - name: Signal readiness (if secret not set)
        if: steps.fork.outputs.is_fork != 'true' && env.ANTHROPIC_API_KEY == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          body=$(printf '%s\n\n## Quibble Review Summary\n\nHEAD: `%s`\n\n_reviewer failed — no findings this run._\n\n`MissingCredential: ANTHROPIC_API_KEY is not set`\n\nSet the repository Actions secret and retry the review.' \
            '<!-- reviewer:claude-failure -->' "$HEAD_SHA")
          gh pr comment "$PR" --body "$body"
          echo "::error::ANTHROPIC_API_KEY is not set; posted Quibble failure marker"
          exit 1
