# review.yml — PR review GA (agent-pluggable).
#
# The reviewing agent is selected by the repo variable `AGENT` (Settings → Secrets
# and variables → Actions → Variables). Defaults to `claude`. Each agent has its
# own secret and its own call script; see the case statement in the "Run agent
# review" step below.
#
# Supported values (add more in the case statement as agents are wired):
#   AGENT=claude   — requires secret ANTHROPIC_API_KEY   (default; call implemented)
#   AGENT=jules    — requires secret JULES_API_KEY       (placeholder — not wired)
#   AGENT=copilot  — requires secret COPILOT_API_KEY     (placeholder — not wired)
#
# To switch agents at the repo level:
#   gh variable set AGENT --body jules
# Or set it per-environment via Settings → Environments.

name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]  # for @claude review re-triggers

permissions:
  pull-requests: write
  contents: read

env:
  AGENT: ${{ vars.AGENT || 'claude' }}

jobs:
  review:
    # Codex P2: restrict issue_comment re-triggers to PR comments (issues also fire issue_comment).
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Codex P1: forked pull_request events run without repo secrets and with a read-only
      # GITHUB_TOKEN — Claude can't be called and comments can't be posted. Detect and skip.
      # issue_comment events (even on cross-repo PRs) run in the base repo context and DO
      # have secret access, so they are not gated here.
      - name: Determine PR fork status
        id: fork
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip review on forked PR
        if: steps.fork.outputs.is_fork == 'true'
        run: |
          echo "::notice::Forked PR detected — ANTHROPIC_API_KEY and write permissions are unavailable on fork pull_request events. Skipping Claude review. A maintainer can re-run by commenting '@claude review' on the PR (issue_comment runs in the base repo context and has secret access)."

      - name: Fetch PR context
        id: context
        if: steps.fork.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number || github.event.issue.number }}
          gh pr view $PR_NUM --json number,title,body,url,headRefName,baseRefName,commits,files --jq . > /tmp/pr.json
          gh pr diff $PR_NUM > /tmp/pr.diff
          # Codex P2 (sticky preservation): READ verify.yml's sticky comment for CONTEXT ONLY.
          # Do not edit, update, or delete it here — the pixel gate owns that comment. The
          # Claude review posts SEPARATE comments (see "Run Claude review" step below).
          gh api repos/${{ github.repository }}/issues/$PR_NUM/comments \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/sticky.md
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Load review context
        if: steps.fork.outputs.is_fork != 'true'
        run: |
          cat AGENTS.md > /tmp/context.md
          echo '---' >> /tmp/context.md
          # skill/review/SKILL.md lands in a follow-up PR (skill/review-add); gate on presence
          if [ -f skill/review/SKILL.md ]; then
            cat skill/review/SKILL.md >> /tmp/context.md
            echo '---' >> /tmp/context.md
          else
            echo "warning: skill/review/SKILL.md not present on this branch — skipping skill context load" >&2
          fi
          for adr in docs/decisions/*.md; do cat "$adr" >> /tmp/context.md; echo '---' >> /tmp/context.md; done

      # Agent dispatch — pick the reviewer by $AGENT (workflow env, from vars.AGENT).
      # Each agent supplies its own secret name and call script. Placeholders exit 0
      # so an unwired agent doesn't fail PRs; an unknown value fails loudly.
      #
      # IMPORTANT (Codex P2): whichever agent runs, its findings MUST post as a
      # SEPARATE comment (or dedicated review body / new thread). It MUST NOT edit or
      # delete verify.yml's sticky evidence comment — that comment is owned by the
      # pixel gate and is what maintainers rely on for run-over-run evidence continuity.
      - name: Run agent review
        if: steps.fork.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
        run: |
          echo "::notice::Selected review agent: $AGENT"
          case "$AGENT" in
            claude)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "::notice::ANTHROPIC_API_KEY not set — skipping review"
                gh pr comment "$PR" --body "Review GA is present but ANTHROPIC_API_KEY is not set in repo secrets. Set it in Settings -> Secrets and variables -> Actions to enable automated review." || true
                exit 0
              fi
              # NOTE: placeholder for the Claude API call. Full implementation
              # requires anthropic-sdk or claude-code-action. This PR ships the
              # workflow skeleton; the actual Claude call lands in a follow-up.
              echo "== would call Claude API here with:"
              echo "  - system: /tmp/context.md (AGENTS + skill/review + ADRs)"
              echo "  - user: /tmp/pr.diff + /tmp/sticky.md (sticky read-only, for context)"
              echo "  - tools: gh (post SEPARATE comments — never edit verify.yml's sticky)"
              # Real implementation: pip install anthropic; python scripts/run-review.py
              echo "PLACEHOLDER — real Claude integration to follow"
              ;;
            jules)
              echo "::notice::Jules integration not yet wired"
              exit 0
              ;;
            copilot)
              echo "::notice::Copilot Workspace integration not yet wired"
              exit 0
              ;;
            *)
              echo "::error::Unknown AGENT: $AGENT"
              exit 1
              ;;
          esac
