name: reviewer-tag

# On-demand entry point for the unified Agent Factory Reviewer.
#
# Comment "/review" (or "@reviewer" / "@agent-factory-reviewer") on a pull request
# to re-run the Reviewer on its CURRENT head without pushing a commit. This is only
# an ENTRY POINT: it dispatches the same .github/workflows/agent-review.yml (the one
# Reviewer path consolidated in PR #254) via workflow_dispatch — it does not run any
# review logic itself, so there is still exactly one Reviewer implementation.
#
# NOTE: issue_comment workflows always execute the copy of this file on the default
# branch, so this only takes effect once merged to main (that is the point — it is
# for future PRs).
on:
  issue_comment:
    types: [created]

permissions:
  actions: write        # dispatch agent-review.yml
  issues: write         # add the 👀 reaction on the PR conversation comment (an issue comment)
  pull-requests: read

jobs:
  dispatch:
    # Cheap pre-filter: only PR comments from a maintainer that mention a trigger
    # phrase at all. The EXACT phrase is then matched precisely in "Parse command"
    # (must lead a line), so incidental prose like "...we should /review this" does
    # not spend a paid re-review. Fork-head secret safety stays in agent-review.yml.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '@reviewer') ||
       contains(github.event.comment.body, '@agent-factory-reviewer'))
    runs-on: ubuntu-latest
    steps:
      - name: Parse command
        id: cmd
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || '';
            // The trigger must LEAD a line (slash-command convention), so an
            // incidental "...we should /review this" in prose does not fire.
            const re = /^[ \t]*(\/review|@reviewer|@agent-factory-reviewer)\b/m;
            core.setOutput('match', re.test(body) ? 'yes' : 'no');
      - name: Acknowledge the request
        if: steps.cmd.outputs.match == 'yes'
        continue-on-error: true        # a failed reaction must never block the dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });
      - name: Dispatch the unified Reviewer for this PR
        if: steps.cmd.outputs.match == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.issue.number;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agent-review.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr: String(pr) },
            });
            core.notice(`Dispatched agent-review for PR #${pr}`);
