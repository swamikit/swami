name: publish-docs

# DocC publishing to GitHub Pages.
# - On trusted PRs: builds DocC and publishes it under gh-pages/pr-<N>/.
#   Builder carries the preview URL in its single current-head evidence comment.
# - On push to development: publishes the cumulative candidate under /dev/.
# - On push to main: builds DocC and publishes to gh-pages/ (root = production).
# - workflow_dispatch: manual re-publish for the current ref.
#
# gh-pages branch layout (target repo swamikit/swami → https://swamikit.github.io/swami/):
#   /               <- latest (from main)
#   /dev/           <- cumulative candidate (from development)
#   /pr-<N>/        <- one directory per open PR

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main, development]
    # Merges that only touch pattern sources feed post-merge.yml, which
    # renders fresh PNGs into DocC Resources and pushes them back to main.
    # That follow-up commit (path: app/Swami/Swami.docc/Resources/**) is
    # what should trigger publish-docs — publishing on the raw merge would
    # ship stale renders. Ignoring the pattern-source path keeps this
    # workflow off the merge push; the render commit still fires it.
    paths-ignore:
      - 'app/Swami/Patterns/*.swift'
  workflow_dispatch:

permissions:
  contents: write        # push to gh-pages

concurrency:
  # Serialize every writer to gh-pages — PR previews, main publishes, and
  # manual re-runs all mutate the same branch, so a per-ref group let two
  # PRs race on gh-pages. One shared group + cancel-in-progress: false
  # forces them into a queue and preserves each run's push.
  group: gh-pages
  cancel-in-progress: false

env:
  APP_PROJECT: app/Swami.xcodeproj
  # DocC catalog lives inside the Swami framework target.
  DOCC_SCHEME: Swami
  # Public site base — https://<owner>.github.io/<repo>/
  SITE_REPO: swami

jobs:
  build-and-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          xcrun --find docc

      - name: Resolve publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            echo "subpath=pr-${pr}" >> "$GITHUB_OUTPUT"
            echo "hosting_base=/${SITE_REPO}/pr-${pr}" >> "$GITHUB_OUTPUT"
            echo "public_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${SITE_REPO}/pr-${pr}/documentation/swami/" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "development" ]; then
            echo "subpath=dev" >> "$GITHUB_OUTPUT"
            echo "hosting_base=/${SITE_REPO}/dev" >> "$GITHUB_OUTPUT"
            echo "public_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${SITE_REPO}/dev/documentation/swami/" >> "$GITHUB_OUTPUT"
          else
            echo "subpath=" >> "$GITHUB_OUTPUT"
            echo "hosting_base=/${SITE_REPO}" >> "$GITHUB_OUTPUT"
            echo "public_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${SITE_REPO}/documentation/swami/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DocC archive
        run: |
          set -euo pipefail
          # docbuild emits a .doccarchive into DerivedData. Generic destination
          # keeps us off simulator boot cost — DocC only needs the symbol graph.
          xcodebuild docbuild \
            -project "${APP_PROJECT}" \
            -scheme "${DOCC_SCHEME}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build

          archive=$(find build -type d -name '*.doccarchive' | head -1)
          if [ -z "${archive}" ]; then
            echo "::error::no .doccarchive produced by docbuild"
            exit 1
          fi
          echo "archive=${archive}" >> "$GITHUB_ENV"

      - name: Guard empty archive
        id: guard
        run: |
          set -euo pipefail
          # DocC emits one JSON per rendered page under data/documentation/.
          # An archive with fewer than 2 real pages is an Xcode-placeholder
          # catalog (just the module shell) — publishing it ships a blank
          # white page over the last good preview. Skip publish instead.
          pages=$(find "${archive}" -type f -name '*.json' -path '*/data/documentation/*' | wc -l | tr -d ' ')
          echo "pages=${pages}" >> "$GITHUB_OUTPUT"
          if [ "${pages}" -lt 2 ]; then
            echo "::warning::DocC archive has ${pages} documentation page(s) — treating as empty and skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Transform archive for static hosting
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          xcrun docc process-archive transform-for-static-hosting \
            "${archive}" \
            --output-path site \
            --hosting-base-path "${{ steps.target.outputs.hosting_base }}"

      - name: Validate static site and hosting base
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 scripts/prepare_docc_site.py site \
            --hosting-base "${{ steps.target.outputs.hosting_base }}" \
            --landing-path documentation/swami
          python3 scripts/validate_docc_site.py site \
            --hosting-base "${{ steps.target.outputs.hosting_base }}" \
            --landing-path documentation/swami

      - name: Publish to gh-pages
        if: steps.guard.outputs.skip != 'true'
        env:
          SUBPATH: ${{ steps.target.outputs.subpath }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch (or create) gh-pages in a sibling worktree so we don't
          # disturb the source checkout.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages:gh-pages
            git worktree add gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages
            (cd gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi

          # Replace only the slice we own — PR dir on PRs, or root files on main.
          if [ -n "${SUBPATH}" ]; then
            # Delete the whole prior slice before copying. This preserves
            # deletions and renames; cp must never overlay a stale preview.
            rm -rf "gh-pages/${SUBPATH}"
            mkdir -p "gh-pages/${SUBPATH}"
            cp -R site/. "gh-pages/${SUBPATH}/"
          else
            # Root production publish: keep candidate and PR previews intact.
            find gh-pages -mindepth 1 -maxdepth 1 \
              ! -name '.git' ! -name 'pr-*' ! -name 'dev' -exec rm -rf {} +
            cp -R site/. gh-pages/
          fi

          # .nojekyll so DocC's `_` paths serve as-is.
          touch gh-pages/.nojekyll

          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "docs: publish ${SUBPATH:-root} from ${GITHUB_SHA::7}"
          git push origin gh-pages

  fork-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Explain trusted publication boundary
        run: |
          echo "::notice::PR DocC publication is withheld for fork-authored code because repository write credentials are unavailable to untrusted pull requests."
          {
            echo "## Fork DocC policy"
            echo
            echo "The documentation archive is not published from untrusted fork code. A maintainer can bring the head into this repository and dispatch the trusted workflow."
          } >> "$GITHUB_STEP_SUMMARY"
