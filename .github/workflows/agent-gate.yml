name: agent-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  gate:
    uses: samuelalake/agent-factory/.github/workflows/gate.yml@5b450d9f419345a7eb79f3a0ff619f88ce0ec757
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      factory_ref: 5b450d9f419345a7eb79f3a0ff619f88ce0ec757
