name: agent-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  gate:
    uses: samuelalake/agent-factory/.github/workflows/gate.yml@43a522943d0a587684e48d933491d3690a3388a1
    with:
      pr: ${{ github.event.pull_request.number || inputs.pr }}
      factory_ref: 43a522943d0a587684e48d933491d3690a3388a1
