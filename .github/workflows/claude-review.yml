name: Claude Review (swami)

# Claude reviews swami PRs on Samuel's Max subscription (claude-code-action + OAuth).
# Claude auto-loads CLAUDE.md -> AGENTS.md, so the review is graded against the project's
# real bar (parser determinism, ADRs, "a compile is necessary, never sufficient").
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token` on the Max plan).
#
# Opt-in per PR via the `claude-review` label so this does not double-review with the
# agent-factory (MiniMax) Reviewer in agent-review.yml. Once Claude takes over that role,
# drop the label gate (and retire the MiniMax review job) so it runs on every PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      (contains(join(github.event.pull_request.labels.*.name, ','), 'claude-review')
       || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
