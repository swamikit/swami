name: post-merge

# Runs after a PR touching app/Swami/Patterns/** lands on development or main.
# For each pattern the merge changed it renders the SwiftUI view in a booted
# simulator, wraps that screenshot in a device frame, and commits the framed
# PNG into the DocC catalog's Resources/Patterns/. publish-docs then picks the
# commit up and re-publishes the gallery to gh-pages/.
#
# Self-contained by design: an earlier version fetched cached renders from a
# `ci-screenshots` branch that nothing populated, so every run hit "no cached
# render" and the gallery stayed empty. This renders fresh from SwamiHost
# (the same mechanics verify.yml uses for the pixel gate) so there is no
# cross-branch cache to keep alive.
#
# workflow_dispatch `patterns` lets a maintainer backfill: "all" re-renders
# every registered pattern that has a DocC page; a space/comma list re-renders
# just those stems.

on:
  push:
    branches: [main, development]
    paths:
      # Pattern sources are flat *.swift files, one per pattern
      # (e.g. app/Swami/Patterns/Interaction_Drag.swift). Trigger on those only.
      - 'app/Swami/Patterns/*.swift'
  workflow_dispatch:
    inputs:
      patterns:
        description: 'Stems to (re)render: "all", or a comma/space list like "Interaction_Drag Interaction_Pinch". Empty = detect from the push diff.'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  # Serialize — every run commits to an integration branch, and two racing
  # runs on the same branch would collide.
  group: post-merge
  cancel-in-progress: false

env:
  APP_PROJECT: app/Swami.xcodeproj
  SCHEME: SwamiHost
  DOCC_RESOURCES: app/Swami/Swami.docc/Resources/Patterns
  DOCC_PATTERNS: app/Swami/Swami.docc/Patterns

jobs:
  renders:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Mint Builder installation token
        id: builder-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout integration branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.builder-token.outputs.token }}

      - name: Resolve target patterns
        id: patterns
        env:
          # Pass untrusted/event values through the environment, never inlined
          # into the script body (Actions injection hygiene).
          EVENT_NAME: ${{ github.event_name }}
          PATTERNS_INPUT: ${{ github.event.inputs.patterns }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Build a newline list of "slug:Stem" pairs to render. Sources:
          #   * workflow_dispatch input "patterns": "all" = every registry entry;
          #     otherwise the given stems (comma/space separated).
          #   * push: the stems whose Patterns/<Stem>.swift changed in this merge.
          # In every case we keep only stems that own a DocC page
          # (Patterns/<Stem>.md) — those are the ones whose @PageImage consumes a
          # card, so Touch (no page) is skipped without a special case.
          #
          # .github/patterns.txt lines are "slug:Stem" (comments start with #).
          # We resolve slug<->stem by splitting on ":" the same portable way
          # verify.yml does, with no bash-4 associative array (macOS /bin/bash is
          # 3.2).
          registry() { grep -vE '^[[:space:]]*(#|$)' .github/patterns.txt; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${PATTERNS_INPUT:-}" ] || [ "${PATTERNS_INPUT}" = "all" ]; then
              want=$(registry | awk -F: 'NF>=2{print $2}')
            else
              want=$(printf '%s' "$PATTERNS_INPUT" | tr ',' ' ')
            fi
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" \
                      -- 'app/Swami/Patterns/*.swift' || true)
            want=$(printf '%s\n' "$changed" | awk -F/ 'NF{print $4}' | sed 's/\.swift$//')
          fi

          pairs=""
          for stem in $want; do
            [ -n "$stem" ] || continue
            if [ ! -f "${DOCC_PATTERNS}/${stem}.md" ]; then
              echo "skip ${stem}: no DocC page ${DOCC_PATTERNS}/${stem}.md"
              continue
            fi
            slug=$(registry | awk -F: -v s="$stem" '$2==s{print $1; exit}')
            if [ -z "$slug" ]; then
              echo "skip ${stem}: not in .github/patterns.txt"
              continue
            fi
            pairs="${pairs}${slug}:${stem}"$'\n'
          done
          pairs=$(printf '%s' "$pairs" | sed '/^$/d' | sort -u)
          echo "target pairs:"; printf '%s\n' "$pairs"
          {
            echo "pairs<<PAIRS_EOF"
            printf '%s\n' "$pairs"
            echo "PAIRS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if nothing to render
        id: gate
        run: |
          if [ -z "$(printf '%s' '${{ steps.patterns.outputs.pairs }}' | tr -d '[:space:]')" ]; then
            echo "no renderable patterns — nothing to do"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python (device-frame compositor)
        if: steps.gate.outputs.empty != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        if: steps.gate.outputs.empty != 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Pick + boot a simulator
        id: sim
        if: steps.gate.outputs.empty != 'true'
        run: |
          # Render the gallery on a consistent, current-generation iPhone so every
          # card matches. Rank the scheme's iOS-Simulator destinations by tier
          # (Pro Max = Plus > Pro > iPhone > Air > SE) then model number, newest
          # first. `set +e`/`set -e` guards the pipeline so a nonzero xcodebuild
          # exit still reaches the alphabetic fallback below.
          set +e
          UDID=$(xcodebuild -showdestinations \
                   -project "$APP_PROJECT" -scheme "$SCHEME" 2>/dev/null \
            | awk '
                /platform:iOS Simulator/ {
                  id=""; name=""
                  if (match($0, /id:[^,]+/))   { id   = substr($0, RSTART+3, RLENGTH-3) }
                  if (match($0, /name:[^}]+/)) { name = substr($0, RSTART+5, RLENGTH-5) }
                  gsub(/^ +| +$/, "", id); gsub(/^ +| +$/, "", name)
                  if (id == "" || name == "") next
                  if (index(id, "dvtdevice-") == 1) next
                  # Gallery cards are iPhone-framed; never let an iPad win the rank.
                  if (name !~ /iPhone/) next
                  tier = 2
                  if      (name ~ /Pro Max/) tier = 4
                  else if (name ~ /Plus/)    tier = 4
                  else if (name ~ /Pro/)     tier = 3
                  else if (name ~ /Air/)     tier = 1
                  else if (name ~ /SE/)      tier = 0
                  model = 0
                  if (match(name, /iPhone[ ]+[0-9]+/)) {
                    tok = substr(name, RSTART, RLENGTH); sub(/^iPhone[ ]+/, "", tok); model = tok + 0
                  }
                  printf "%d\t%d\t%s\t%s\n", tier, model, id, name
                }
              ' \
            | sort -k1,1nr -k2,2nr \
            | head -n1 \
            | cut -f3)
          set -e
          if [ -z "$UDID" ]; then
            echo "  ranking produced nothing — alphabetic fallback"
            UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];ios=sorted(k for k in d if 'iOS' in k);devs=[x for k in ios for x in d[k] if x.get('isAvailable') and 'iPhone' in x['name']];print(devs[-1]['udid'] if devs else '')")
          fi
          test -n "$UDID" || { echo 'No iOS simulator on this runner image'; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build SwamiHost (once)
        if: steps.gate.outputs.empty != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project "$APP_PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install SwamiHost to sim
        id: app
        if: steps.gate.outputs.empty != 'true'
        run: |
          APP=$(find build/Build/Products -name 'SwamiHost.app' -maxdepth 3 | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          echo "bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: Render + frame each pattern
        if: steps.gate.outputs.empty != 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP_ID: ${{ steps.app.outputs.bid }}
          PAIRS: ${{ steps.patterns.outputs.pairs }}
        run: |
          set -uo pipefail
          # NB: not `-e`. One flaky sim launch/screenshot must not abort the whole
          # loop and throw away cards that already rendered — each pattern's risky
          # steps are guarded and `continue` on failure, mirroring verify.yml's
          # per-pattern resilience.
          mkdir -p out/raw "${DOCC_RESOURCES}"
          # Read the pairs into an array first so the loop body runs in THIS shell,
          # not a `while`-in-a-pipe subshell.
          pairs=$(printf '%s\n' "$PAIRS" | sed '/^$/d')
          for pair in $pairs; do
            slug="${pair%%:*}"; stem="${pair##*:}"
            echo "==> ${stem} (slug ${slug})"
            xcrun simctl terminate "$UDID" "$APP_ID" 2>/dev/null || true
            if ! SIMCTL_CHILD_SWAMI_PATTERN="$slug" xcrun simctl launch "$UDID" "$APP_ID"; then
              echo "::warning::launch failed for ${stem} — skipping"; continue
            fi
            sleep 3
            if ! xcrun simctl io "$UDID" screenshot "out/raw/${stem}.png"; then
              echo "::warning::screenshot failed for ${stem} — skipping"; continue
            fi
            # --reject-uniform: a blank/solid capture (wrong view, nothing drawn)
            # is skipped instead of framed and published as a dead card.
            if ! python3 scripts/frame_render.py --reject-uniform \
                 "out/raw/${stem}.png" "${DOCC_RESOURCES}/${stem}.png"; then
              echo "::warning::frame/quality-gate rejected ${stem} — skipping"; continue
            fi
            echo "framed ${stem}"
          done
          echo "framed cards:"; ls -la "${DOCC_RESOURCES}"

      - name: Commit framed renders back to the integration branch
        if: steps.gate.outputs.empty != 'true'
        run: |
          set -euo pipefail
          git config user.name "Builder"
          git config user.email "builder@agent-factory.local"
          git add "${DOCC_RESOURCES}" || true
          if git diff --cached --quiet; then
            echo "no render changes"
            exit 0
          fi
          # [skip verify] — this commit only touches DocC Resources, never a
          # pattern source, so the pixel gate has nothing new to check.
          git commit -m "docs(patterns): update gallery renders [skip verify]"
          # A human merge can land on the branch during the multi-minute render,
          # which would reject a plain push as non-fast-forward. Rebase our single
          # Resources-only commit onto the moved tip and retry a few times; the
          # paths don't overlap normal source changes so this stays conflict-free.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"; exit 0
            fi
            echo "push rejected — rebasing onto origin/${GITHUB_REF_NAME} (attempt ${attempt})"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; break; }
          done
          echo "::error::could not push gallery renders after rebase retries"
          exit 1

      - name: Upload framed renders (evidence)
        if: steps.gate.outputs.empty != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-renders
          path: |
            out/raw/*.png
            app/Swami/Swami.docc/Resources/Patterns/*.png
          if-no-files-found: warn
